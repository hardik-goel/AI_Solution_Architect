<script>
/* ============================================================= SLIDE DATA */
const SLIDES = [
/* 0 COVER */
`<div class="cover">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="driftchip" style="top:11%;right:28%">"the model was not good enough"</div>
  <div class="driftchip" style="top:79%;right:35%;animation-delay:-2s">"we should have built it ourselves"</div>
  <div class="driftchip" style="top:87%;right:13%;animation-delay:-4s">"accuracy is at ninety per cent now"</div>
  <div class="left">
    <div class="eyebrow riseUp"><span class="dot"></span> THE ROUND TABLE &amp; THE BUILDING-BLOCK SKETCH</div>
    <h1 class="riseUp d1"><span class="shimmer">Ten people.</span><br>One problem.<br>Nobody in the<br>room is wrong.</h1>
    <p class="sub riseUp d2" style="margin-top:12px;max-width:600px">You read out the failure you bet on last time. Then you take a seat at a table where a real company spent five years and two technology partners on one capability, got it wrong, and has now committed billions to doing it again. Last thing, you draw the whole thing on one page.</p>
    <div class="riseUp d3" style="margin-top:18px;display:flex;gap:8px;flex-wrap:wrap">
      <span class="pill">The failure you bet on</span>
      <span class="pill">A ten-seat Round Table</span>
      <span class="pill">10-minute break</span>
      <span class="pill" style="border-color:var(--sage);color:var(--sage)">A sketch you take away</span>
    </div>
  </div>
  <div class="riseUp d2" style="flex:1;max-width:430px;display:flex;flex-direction:column;gap:11px;z-index:2">
    <div class="card" style="padding:12px 14px;border-left:3px solid var(--cobalt)"><div class="chip" style="font-size:9.5px">First, the read-out</div><p style="font-size:12.5px;margin-top:6px;line-height:1.4"><b>Three lines a pod on why Alexa+ was retired.</b> You wrote the failure before anything went wrong. Now you say it with other people listening.</p></div>
    <div class="card" style="padding:12px 14px;border-left:3px solid var(--amber)"><div class="chip amber" style="font-size:9.5px">Then the Round Table</div><p style="font-size:12.5px;margin-top:6px;line-height:1.4"><b>Ten seats, one problem statement.</b> Every seat is defensible, incomplete, and incompatible with at least two of the others. You argue from inside yours even when it makes you look unreasonable.</p></div>
    <div class="card" style="padding:12px 14px;border-left:3px solid var(--sage)"><div class="chip" style="font-size:9.5px">You leave with</div><p style="font-size:12.5px;margin-top:6px;line-height:1.4">A six-block sketch of one AI capability, on one page, with an owner, a failure mode and a number against every block. Drawn by you, pressure-tested, and ready to point at your own estate.</p></div>
    <div style="background:var(--ink);color:#EAF0FF;border-radius:13px;padding:12px 14px">
      <div style="font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);font-weight:700">The thread, in one line</div>
      <div style="font-family:var(--disp);font-size:17px;font-weight:800;margin-top:5px;line-height:1.2">The first attempt<br>bought a model.<br>The second one built<br>the place to put it.</div>
      <p style="font-size:12px;margin-top:7px;line-height:1.4;color:rgba(234,240,255,.88)">Everything today turns on noticing that those are different decisions, and that only one of them is usually on the agenda.</p>
    </div>
  </div>
</div>`,

/* 1 ALEXA+ DEBRIEF: THE CASE AND WHAT YOU WERE ASKED */
`<div class="eyebrow reveal"><span class="dot"></span> DEBRIEF &middot; THE ALEXA+ PRE-MORTEM YOU WROTE</div>
<h2 class="reveal">You were told Alexa+ had been quietly retired eighteen months from now, and asked to say why</h2>
<p class="sub reveal">Before anybody reads anything out, the same facts back on the board, so that every pod is arguing about the same product. Nothing here was invented. The thing nobody has is the outcome.</p>
<div class="tablefill reveal" style="margin-top:9px">
  <div class="maprow3 maphead" style="grid-template-columns:0.62fr 1.6fr 1.3fr"><div>What is known</div><div>The published fact</div><div>Why it is in your pack</div></div>
  <div class="maprow3" style="grid-template-columns:0.62fr 1.6fr 1.3fr"><div><b>REACH</b></div><div style="font-family:var(--body);font-size:12px;color:var(--ink)">Announced <b>26 February 2025</b>, opened to all US customers on <b>4 February 2026</b> after a year in early access. Over <b>600 million</b> Alexa devices sold into homes.</div><div>Distribution is not adoption. An installed base that large guarantees exposure to the failure, not survival of the product.</div></div>
  <div class="maprow3" style="grid-template-columns:0.62fr 1.6fr 1.3fr"><div><b>PRICE</b></div><div style="font-family:var(--body);font-size:12px;color:var(--ink)"><b>Free with Prime. $19.99 a month</b> without it. A limited free tier exists on the web and in the app.</div><div>The price tells you who is expected to pay and what has to happen for them to keep paying. Most pods wrote their failure against that number.</div></div>
  <div class="maprow3" style="grid-template-columns:0.62fr 1.6fr 1.3fr"><div><b>THE SWITCH</b></div><div style="font-family:var(--body);font-size:12px;color:var(--ink)">It is the <b>default</b> on existing hardware, and a customer can still switch back to the old Alexa. Amazon has not said for how long that stays true.</div><div>A reversible rollout is a design decision with a cost attached. Somebody is paying to keep both paths alive.</div></div>
  <div class="maprow3" style="grid-template-columns:0.62fr 1.6fr 1.3fr"><div><b>THE NUMBERS<br>PUBLISHED</b></div><div style="font-family:var(--body);font-size:12px;color:var(--ink)">More music played. More recipes used. More conversations, and longer ones. <b>All real, all reported, none of them about renewal, completion or money.</b></div><div>Every number offered is an engagement number. The number that would settle it has not been published, and that gap is where most pods found their failure.</div></div>
  <div class="mapnote"><b>What you were asked for.</b> Not a prediction. A failure story that is credible, a signal that could genuinely have been seen in time by a named role, and one decision with an owner. <b>You are judged on the reasoning, never on whether it comes true.</b></div>
</div>
<div class="actbar reveal" style="margin-top:auto"><div class="lab">Before you<br>read out</div><p>Check your own three lines against one test: <b>if Amazon had done the obvious fix, would your failure still happen?</b> If the answer is no, you have written a bug report rather than a failure path, and it is worth thirty seconds to say so honestly when your turn comes.</p></div>`,

/* 2 ALEXA+ READ-OUT: THREE LINES A POD */
`<div class="eyebrow reveal"><span class="dot"></span> PRE-MORTEM &middot; WHAT EACH POD READS OUT</div>
<h2 class="reveal">Three lines a pod. The failure, the signal, the decision.</h2>
<p class="sub reveal">Three sentences, in this order, and nothing else. No preamble about how you got there, no fourth line. I am typing as you talk and the constraint is the exercise.</p>
<div class="grid3 reveal" style="margin-top:9px">
  <div class="card" style="border-left:3px solid var(--clay);padding:9px 12px"><div class="label">LINE 1 &middot; THE FAILURE</div><p style="font-size:11.5px;margin-top:4px;line-height:1.34">The one you would bet on, in business words. If it contains the word "model" it is probably not your most likely failure.</p></div>
  <div class="card" style="border-left:3px solid var(--cobalt);padding:9px 12px"><div class="label">LINE 2 &middot; THE SIGNAL</div><p style="font-size:11.5px;margin-top:4px;line-height:1.34">What is observable first, and the role who sees it. A signal nobody is looking at is not a signal.</p></div>
  <div class="card" style="border-left:3px solid var(--sage);padding:9px 12px"><div class="label">LINE 3 &middot; THE DECISION</div><p style="font-size:11.5px;margin-top:4px;line-height:1.34">One decision, one owner, one date. The test is whether that person could say yes to it this quarter.</p></div>
</div>
<div class="podpad" data-pad="1">
  <div class="ppbar">
    <button class="ppbtn" onclick="podMore('1')">+ POD</button>
    <button class="ppbtn" onclick="podLess('1')">- POD</button>
    <span class="ppcount" data-pad="1">6 pods</span>
    <button class="ppbtn" onclick="podClear('1')">CLEAR</button>
    <button class="ppbtn" onclick="podExport()">EXPORT .TXT</button>
  </div>
  <div class="ppgrid" data-pad="1"></div>
</div>
<div class="actbar reveal"><div class="lab">Then we<br>compare</div><p>Where two pods bet on different failures, both are probably right and they are describing <b>different years</b>. Where every pod bets on the same one, the room has either found the real risk or inherited the same assumption, and it is worth five minutes to find out which.</p></div>`,

/* 3 THE ROUND TABLE: THE SITUATION */
`<div class="eyebrow reveal"><span class="dot"></span> THE ROUND TABLE &middot; THE SITUATION ON THE TABLE</div>
<h2 class="reveal">A company bought a speech business, sold it, ran the pilot for two and a half years, stopped, and has now committed billions to doing it again</h2>
<p class="sub reveal">Voice ordering at the McDonald's drive-thru, 2019 to today. Every line below is public and dated. You are in the room that has to say what the problem actually was, and the ten people in it do not agree about which of these lines matters.</p>
<div class="tablefill reveal" style="margin-top:9px">
  <div class="maprow3 maphead" style="grid-template-columns:0.66fr 1.72fr 1.18fr"><div>When</div><div>What happened</div><div>What it meant</div></div>
  <div class="maprow3" style="grid-template-columns:0.66fr 1.72fr 1.18fr"><div><b>2019<br>the build</b></div><div style="font-family:var(--body);font-size:11.9px;color:var(--ink)">McDonald's acquires <b>Apprente</b>, a voice artificial-intelligence company, and stands up <b>McD Tech Labs</b> to advance customer and crew-facing technology.</div><div>The problem has been named as <b>speech recognition</b>, and the answer to it is to own a speech business. Everything that follows is downstream of that sentence.</div></div>
  <div class="maprow3" style="grid-template-columns:0.66fr 1.72fr 1.18fr"><div><b>OCT 2021<br>the sell</b></div><div style="font-family:var(--body);font-size:11.9px;color:var(--ink)">McD Tech Labs is sold to <b>IBM</b>, terms undisclosed, with a strategic partnership on Automated Order Taking. The chief executive: putting the technology into roughly <b>14,000 restaurants</b>, with varied menus and new languages, <b>"is beyond the scale of our core competencies."</b></div><div>Two years in, the company says out loud that the hard part is <b>not the speech</b>, it is the estate. It then hands the capability to somebody else rather than redefining the problem.</div></div>
  <div class="maprow3" style="grid-template-columns:0.66fr 1.72fr 1.18fr"><div><b>2022-24<br>the pilot</b></div><div style="font-family:var(--body);font-size:11.9px;color:var(--ink)">About <b>100 US restaurants</b> run it. A 2022 analyst report puts voice ordering accuracy in the <b>low 80% range</b> against an internal bar of <b>95% plus</b> before any broad rollout. Videos of wrong orders travel widely.</div><div>Two and a half years of pilot inside a hundred restaurants out of forty thousand. <b>The pilot was never the thing that was hard</b>, and it was the only thing being measured.</div></div>
  <div class="maprow3" style="grid-template-columns:0.66fr 1.72fr 1.18fr"><div><b>DEC 2023<br>the estate</b></div><div style="font-family:var(--body);font-size:11.9px;color:var(--ink)">A multi-year global partnership with <b>Google Cloud</b>. Google Distributed Cloud hardware and software goes into <b>thousands of restaurants</b> so that applications and AI can run <b>inside the restaurant</b>. The company has over 40,000 locations, about <b>95% owned by independent operators</b>.</div><div>Six months before the pilot is stopped, somebody buys the <b>missing layer</b>: compute in the building. Notice it is procured as infrastructure, not as a voice project.</div></div>
  <div class="maprow3" style="grid-template-columns:0.66fr 1.72fr 1.18fr"><div><b>JUN 2024<br>the stop</b></div><div style="font-family:var(--body);font-size:11.9px;color:var(--ink)"><b>"After thoughtful review, McDonald's has decided to end our current global partnership with IBM on AOT beyond this year."</b> Voice ordering <b>"will be part of our restaurants' future"</b>, with a decision on a long-term solution promised by year end.</div><div>The capability is not abandoned. <b>The partner and the shape are.</b> Read that sentence as an architecture decision and it stops looking like a failure.</div></div>
  <div class="maprow3" style="grid-template-columns:0.66fr 1.72fr 1.18fr"><div><b>2026<br>the second<br>attempt</b></div><div style="font-family:var(--body);font-size:11.9px;color:var(--ink)"><b>Archy</b> takes drive-thru orders in English and Spanish on Google edge computers inside the restaurant, reported <b>above 90%</b> accuracy. Started in <b>five</b> restaurants carrying over a million transactions; edge hardware now in thousands across seven major markets. US rollout begins <b>2027</b>, behind <b>$8.5bn</b> of operator support to 2036, a target of about <b>$100,000</b> gross annual cash flow per US restaurant and roughly a <b>four-year payback</b>.</div><div>The second attempt leads with <b>hardware, money and the operator's payback</b>, and treats voice as one application sitting on top. The accuracy moved from the low eighties to the low nineties, which is real and <b>is not what changed</b>.</div></div>
  <div class="mapnote"><b>All 2026 figures are the company's own and unaudited.</b> Sources: McDonald's and Google Cloud press release, 6 December 2023. Restaurant Business on the McD Tech Labs sale, October 2021. Nation's Restaurant News and CNBC, 17 June 2024. PYMNTS on the 23 September 2026 investor day, carrying Bloomberg's accuracy figure.</div>
</div>
<div class="actbar reveal" style="margin-top:auto"><div class="lab">The request<br>on your desk</div><p><b>"The money for the second attempt is already approved. Before the rollout starts I want one page from this room: what the problem actually was the first time, and which of those conditions is still true today."</b> You are not being asked whether Archy will work, and you are not being asked to pick a vendor.</p></div>`,

/* 4 THE ROUND TABLE: TEN SEATS */
`<div class="eyebrow reveal"><span class="dot"></span> THE ROUND TABLE &middot; TAKE ONE SEAT AND STAY IN IT</div>
<h2 class="reveal">Ten seats at the table. Seven are always filled. Three are filled only if your pod is large enough.</h2>
<p class="sub reveal">Each person takes one seat and argues from inside it for the whole session, including the parts that make you look unreasonable. The last three are marked optional: drop them from the bottom up if your pod is smaller.</p>
<div class="tablefill reveal" style="margin-top:9px">
  <div class="maprow3 maphead" style="grid-template-columns:0.84fr 1.04fr 1.54fr"><div>Seat</div><div>What you are measured on</div><div>Your opening position, which you must defend before you may move</div></div>
  <div class="maprow3" style="grid-template-columns:0.84fr 1.04fr 1.54fr"><div><b>1 &middot; CHIEF EXECUTIVE</b></div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">Growth, the investor promise, the brand</div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">"We were right to want this and wrong about who should build it. We bought a speech company, found out it was an estate problem, and sold the speech company. I would do both of those again."</div></div>
  <div class="maprow3" style="grid-template-columns:0.84fr 1.04fr 1.54fr"><div><b>2 &middot; NATIONAL OWNER-OPERATOR REPRESENTATIVE</b></div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">Restaurant cash flow, equipment spend, payback</div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">"I own the restaurant and I buy the equipment. The first time, nobody ever put a payback in front of me. This time there is a number on a slide, and it is your number, unaudited."</div></div>
  <div class="maprow3" style="grid-template-columns:0.84fr 1.04fr 1.54fr"><div><b>3 &middot; CHIEF RESTAURANT OFFICER</b></div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">Throughput, order accuracy, what a shift can absorb</div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">"Accuracy was never my problem. My problem is the eleven seconds after it gets one wrong, with four cars behind and one person on the window."</div></div>
  <div class="maprow3" style="grid-template-columns:0.84fr 1.04fr 1.54fr"><div><b>4 &middot; GLOBAL CHIEF INFORMATION OFFICER</b></div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">The estate: networks, hardware, refresh cycles</div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">"We tried to run a real-time product across an estate with no compute in it. The first attempt did not fail on speech. It failed because there was nowhere for it to run and no way to keep it current."</div></div>
  <div class="maprow3" style="grid-template-columns:0.84fr 1.04fr 1.54fr"><div><b>5 &middot; HEAD OF APPLIED AI AND SPEECH</b></div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">Accuracy, languages, the long tail of the menu</div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">"We went from the low eighties to above ninety. That is a real improvement and it is also not the reason this works now. Nobody wants to hear the second half of that sentence from me."</div></div>
  <div class="maprow3" style="grid-template-columns:0.84fr 1.04fr 1.54fr"><div><b>6 &middot; TECHNOLOGY PARTNER LEAD</b></div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">Delivery at scale, roadmap, commercial terms</div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">"You handed us a group of engineers and asked us to ship into fourteen thousand restaurants you do not own, each with its own menu and queue. The model was the easy part and we said so."</div></div>
  <div class="maprow3" style="grid-template-columns:0.84fr 1.04fr 1.54fr"><div><b>7 &middot; CHIEF FINANCIAL OFFICER</b></div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">Capital, payback, what gets promised publicly</div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">"Billions to 2036 against about a hundred thousand of gross annual cash flow a restaurant and a four-year payback. Every one of those figures is ours and unaudited."</div></div>
  <div class="maprow3" style="grid-template-columns:0.84fr 1.04fr 1.54fr"><div><b>8 &middot; CREW EXPERIENCE LEAD <span class="chip amber" style="font-size:8.5px;padding:1px 5px">OPTIONAL</span></b></div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">Retention, training time, what the job becomes</div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">"Fifty hours a week freed is a number about hours. It is not a number about what the job turns into, and nobody has been asked to write that one down."</div></div>
  <div class="maprow3" style="grid-template-columns:0.84fr 1.04fr 1.54fr"><div><b>9 &middot; BRAND AND CUSTOMER TRUST <span class="chip amber" style="font-size:8.5px;padding:1px 5px">OPTIONAL</span></b></div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">Public perception, the story that travels</div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">"One wrong order went round the world in a day. The accuracy figure that corrects it will never travel that far, and planning as though it will is how we got here."</div></div>
  <div class="maprow3" style="grid-template-columns:0.84fr 1.04fr 1.54fr"><div><b>10 &middot; CUSTOMER ACCESS LEAD <span class="chip amber" style="font-size:8.5px;padding:1px 5px">OPTIONAL</span></b></div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">Orders completed without a person stepping in</div><div style="font-family:var(--body);font-size:11.7px;color:var(--ink)">"Above ninety per cent still means about one order in ten needs rescuing. We have never published who is in that ten per cent."</div></div>
  <div class="mapnote">All ten are defensible, incomplete and incompatible with at least two others. The uncomfortable one is seat 5: <b>the person who improved the model is telling you the model is not why it works now.</b></div>
</div>`,

/* 5 THE ROUND TABLE: THE BRIEF */
`<div class="eyebrow reveal"><span class="dot"></span> THE ROUND TABLE &middot; WHAT YOUR POD HANDS BACK</div>
<h2 class="reveal">One problem statement everybody signs, plus the objection you could not resolve</h2>
<p class="sub reveal">A problem statement, not a solution and not a risk list. It has to be true from inside more than one of those ten seats, and the parts that could not be reconciled get written down rather than quietly dropped.</p>
<div class="tablefill reveal" style="margin-top:9px">
  <div class="maprow3 maphead" style="grid-template-columns:0.84fr 1.74fr 0.92fr"><div>What you write</div><div>What has to be in it</div><div>Where it comes from</div></div>
  <div class="maprow3" style="grid-template-columns:0.84fr 1.74fr 0.92fr"><div><b>1 &middot; THE STATEMENT</b></div><div style="font-family:var(--body);font-size:12.1px;color:var(--ink)">One sentence on what the problem actually was between 2019 and 2024, in words the chief executive and the owner-operator would both recognise. <b>No technology named and no vendor named.</b> Not "the speech model was not accurate enough". What was being bought, what was missing, and who carried it.</div><div>Translating business drivers</div></div>
  <div class="maprow3" style="grid-template-columns:0.84fr 1.74fr 0.92fr"><div><b>2 &middot; THE CONSTRAINT YOU ACCEPTED</b></div><div style="font-family:var(--body);font-size:12.1px;color:var(--ink)">Name the one constraint your statement treats as fixed, and say whether it is <b>law, contract, ownership or merely habit</b>. The franchise model is the obvious candidate and it is not the only one. Then say which seat would have to move for it to change.</div><div>Trade-off analysis</div></div>
  <div class="maprow3" style="grid-template-columns:0.84fr 1.74fr 0.92fr"><div><b>3 &middot; THE CONDITION STILL TRUE TODAY</b></div><div style="font-family:var(--body);font-size:12.1px;color:var(--ink)">One condition from the first attempt that has <b>not</b> been fixed by the second, and the single number that would tell you whether it has. <b>Name the seat that should own that number</b>, from the ten.</div><div>Technical breadth</div></div>
  <div class="maprow3" style="grid-template-columns:0.84fr 1.74fr 0.92fr"><div><b>4 &middot; THE DISSENT</b></div><div style="font-family:var(--body);font-size:12.1px;color:var(--ink)">One seat that still disagrees, named, with their objection in their own words and one line on why the pod went ahead anyway. <b>A pod with no dissent did not have a disagreement, it had a quiet person.</b></div><div>Holistic viewpoint</div></div>
  <div class="mapnote">Then <b>three spoken lines</b> in the main room: the statement, the constraint you accepted, and the dissent with the seat that holds it. Write them verbatim before you finish and decide who reads them. Nothing from this session is collected or marked.</div>
</div>
<div class="listen reveal">
  <div class="lsitem"><div class="lh">What good looks like</div><p>A statement that would still be true if the speech model had been perfect in 2021. A constraint correctly classified as ownership rather than technology. A condition specific enough that one named seat could go and measure it this quarter. A dissent that genuinely bites.</p></div>
  <div class="lsitem"><div class="lh">What not to write</div><p>"The model was not accurate enough." It got better and that is not what changed. "They should have built it in-house." They did, for two years. A constraint that is really a preference. A number called "better monitoring". A dissent invented in the last minute.</p></div>
  <div class="lsitem"><div class="lh">How the room runs</div><p>Four phases, and I will call the length of each on the day. <b>Silent</b>, reading your own seat only. Then <b>round robin</b>, one equal turn a seat, <b>no interruptions and no replies</b>. Then <b>open</b>, to converge and write. Then <b>closing</b>, to rehearse the three lines aloud inside the pod.</p></div>
</div>
<div class="workband reveal" style="margin-top:auto">
  <div class="lab">The one<br>rule</div>
  <p><b>Nobody may propose a problem statement until every seat has spoken once.</b> That single rule is what separates this from a meeting, and it is the one most pods break in the first few minutes.</p>
  <div style="display:flex;gap:7px;flex-wrap:wrap">
    <button class="jbtn rev" onclick="document.getElementById('tm').classList.add('on')">Open the timer</button>
  </div>
</div>`,

/* 6 BREAK */
`<div class="grow center" style="position:relative">
  <div class="blob b2" style="right:15%;top:12%;opacity:.3"></div>
  <div class="eyebrow reveal" style="justify-content:center"><span class="dot"></span> TEN MINUTES</div>
  <h1 class="reveal" style="text-align:center">Break.</h1>
  <p class="sub reveal" style="text-align:center;max-width:580px;font-size:16px">When you sit back down, every pod reads its problem statement into the room, and then you draw the whole capability on one page with six blocks on it.</p>
  <div class="reveal" style="margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:11px">
    <div id="breakclock" style="font-family:var(--disp);font-size:62px;color:var(--cobalt);font-weight:700">10:00</div>
    <div style="display:flex;gap:7px;justify-content:center">
      <button class="jbtn" style="background:var(--card);color:var(--ink);border:2px solid var(--line);padding:7px 13px" onclick="breakAdjust(-5)">-5</button>
      <button class="jbtn" style="background:var(--card);color:var(--ink);border:2px solid var(--line);padding:7px 13px" onclick="breakAdjust(-1)">-1</button>
      <button class="jbtn" style="background:var(--card);color:var(--ink);border:2px solid var(--line);padding:7px 13px" onclick="breakAdjust(1)">+1</button>
      <button class="jbtn" style="background:var(--card);color:var(--ink);border:2px solid var(--line);padding:7px 13px" onclick="breakAdjust(5)">+5</button>
    </div>
    <div style="display:flex;gap:9px">
      <button class="jbtn rev" onclick="breakToggle()" id="breakbtn">Start</button>
      <button class="jbtn" style="background:var(--card);color:var(--ink);border:2px solid var(--line)" onclick="breakReset()">Reset</button>
    </div>
    <p class="hintline" style="margin-top:4px;text-align:center">Bring back the three lines written down, and decide inside your pod who reads them.</p>
  </div>
</div>`,

/* 7 POD NOTES: WHAT EACH POD CAME BACK WITH */
`<div class="eyebrow reveal"><span class="dot"></span> DEBRIEF &middot; WHAT EACH POD CAME BACK WITH</div>
<h2 class="reveal">Three spoken lines a pod: the statement, the constraint, the dissent</h2>
<p class="sub reveal">Statement first, in the words you agreed. No account of how the argument went and no fourth line. I am typing as you speak, and the seats that disagreed are the part I most want on the board.</p>
<div class="grid3 reveal" style="margin-top:9px">
  <div class="card" style="border-left:3px solid var(--clay);padding:9px 12px"><div class="label">LINE 1 &middot; THE STATEMENT</div><p style="font-size:11.5px;margin-top:4px;line-height:1.34">What the problem actually was, in one sentence, with no technology and no vendor in it. If a listener could not tell which company this was about, it is too generic.</p></div>
  <div class="card" style="border-left:3px solid var(--cobalt);padding:9px 12px"><div class="label">LINE 2 &middot; THE CONSTRAINT</div><p style="font-size:11.5px;margin-top:4px;line-height:1.34">The one you treated as fixed, classified as law, contract, ownership or habit, and the seat that would have to move for it to change.</p></div>
  <div class="card" style="border-left:3px solid var(--sage);padding:9px 12px"><div class="label">LINE 3 &middot; THE DISSENT</div><p style="font-size:11.5px;margin-top:4px;line-height:1.34">The seat that still disagrees and their objection in their own words. Read it as they said it, not as your pod reworded it.</p></div>
</div>
<div class="podpad" data-pad="2">
  <div class="ppbar">
    <button class="ppbtn" onclick="podMore('2')">+ POD</button>
    <button class="ppbtn" onclick="podLess('2')">- POD</button>
    <span class="ppcount" data-pad="2">6 pods</span>
    <button class="ppbtn" onclick="podClear('2')">CLEAR</button>
    <button class="ppbtn" onclick="podExport()">EXPORT .TXT</button>
  </div>
  <div class="ppgrid" data-pad="2"></div>
</div>
<div class="actbar reveal"><div class="lab">Then we<br>compare</div><p>Put the statements side by side. Where two pods wrote different statements from the same ten seats, the difference is almost always <b>which seat they let win</b>. That is worth more than either statement, because on your own estate the seat that wins is usually decided before the meeting starts.</p></div>`,

/* 8 HANDS-ON: LET US BUILD THE WORK PRODUCT */
`<div class="eyebrow reveal"><span class="dot"></span> HANDS-ON &middot; LET US BUILD THE WORK PRODUCT</div>
<h2 class="reveal">Somebody has already decided. Draw what they actually asked for.</h2>
<p class="sub reveal">Not a high-level design. An <b>entity diagram of a capability</b>: six boxes, three lines inside each one, and a mark on every relationship saying whether it is one or many. The marks are where the architecture is hiding, because <b>one of something and many of something are different systems</b>.</p>
<div class="reveal" style="margin-top:9px;display:flex;gap:11px;align-items:stretch">
  <div style="flex:0 0 96px;font-family:var(--mono);font-size:9px;letter-spacing:.07em;color:var(--soft);align-self:center;line-height:1.25">THE ASK<br>word for word</div>
  <div style="flex:1 1 auto;background:rgba(240,140,0,.11);border:1px solid rgba(240,140,0,.4);border-radius:9px;padding:9px 14px"><p style="font-family:var(--disp);font-size:17.5px;font-weight:700;line-height:1.3">"Let us use AI to take drive-thru orders, so the crew can stop wearing headsets."</p><p style="font-size:10.6px;color:var(--soft);margin-top:4px">No architecture in it. No vendor in it. The second half names the person whose work is being removed, and that person is box 5.</p></div>
</div>
<div class="grid3 reveal" style="margin-top:7px"><div class="card" style="border-left:3px solid var(--cobalt);padding:7px 11px"><div class="label">1 &middot; THE ASK</div><p style="font-size:11.4px;margin-top:3px;line-height:1.32">The sentence a real person says, in their words, in the noise they say it in.</p><p style="font-size:10.3px;margin-top:4px;line-height:1.25;color:var(--cobalt)"><b>A number worth writing:</b> share handled with nobody stepping in</p></div><div class="card" style="border-left:3px solid var(--cobalt);padding:7px 11px"><div class="label">2 &middot; THE GROUNDING</div><p style="font-size:11.4px;margin-top:3px;line-height:1.32">What it is allowed to look at tonight, and who keeps that list correct.</p><p style="font-size:10.3px;margin-top:4px;line-height:1.25;color:var(--cobalt)"><b>A number worth writing:</b> age of the oldest thing it still quotes</p></div><div class="card" style="border-left:3px solid var(--amber);padding:7px 11px"><div class="label">3 &middot; THE MODEL CALL</div><p style="font-size:11.4px;margin-top:3px;line-height:1.32">The part everyone argues about first. Usually it is not one call, it is three.</p><p style="font-size:10.3px;margin-top:4px;line-height:1.25;color:var(--amber)"><b>A number worth writing:</b> cost and latency per ask, today</p></div></div>
<div class="grid3 reveal" style="margin-top:7px"><div class="card" style="border-left:3px solid var(--sage);padding:7px 11px"><div class="label">4 &middot; THE CHECK</div><p style="font-size:11.4px;margin-top:3px;line-height:1.32">What stops a wrong answer reaching anybody, and who graded it.</p><p style="font-size:10.3px;margin-top:4px;line-height:1.25;color:var(--sage)"><b>A number worth writing:</b> share a human graded before release</p></div><div class="card" style="border-left:3px solid var(--sage);padding:7px 11px"><div class="label">5 &middot; THE HANDOFF</div><p style="font-size:11.4px;margin-top:3px;line-height:1.32">Who picks it up when it fails, and how many of them there are.</p><p style="font-size:10.3px;margin-top:4px;line-height:1.25;color:var(--sage)"><b>A number worth writing:</b> time to reach a person, and how often</p></div><div class="card" style="border-left:3px solid var(--clay);padding:7px 11px"><div class="label">6 &middot; THE RECORD</div><p style="font-size:11.4px;margin-top:3px;line-height:1.32">What gets written down so tomorrow you can tell whether it worked.</p><p style="font-size:10.3px;margin-top:4px;line-height:1.25;color:var(--clay)"><b>A number worth writing:</b> the one that would switch it off</p></div></div>
<div class="actbar reveal"><div class="lab">Where the<br>failure<br>lives</div><p>Not in a box. A thing does not fail, a <b>junction between two things</b> fails, so the failure mode belongs on the line and not inside the rectangle. That is why this is an entity diagram and not a flow chart: "many failed orders arrive at one person" is a sentence you can only write on a relationship, and it is the sentence that decides whether a capability that works in a demonstration survives a real shift.</p></div>
<div class="reveal" style="display:flex;gap:10px;align-items:stretch;margin-top:auto;border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:var(--card)"><div class="lab" style="flex:0 0 74px;font-size:9px;line-height:1.2;color:var(--soft);font-family:var(--mono);letter-spacing:.06em;align-self:center">HOW TO<br>MARK IT</div><div style="display:flex;align-items:center;gap:6px;flex:1 1 0"><svg width="46" height="16"><line x1="2" y1="8" x2="44" y2="8" stroke="#1e1e1e" stroke-width="2"/><line x1="30" y1="2" x2="30" y2="14" stroke="#1e1e1e" stroke-width="2"/></svg><span style="font-size:10.4px;color:var(--ink);line-height:1.15">exactly one</span></div><div style="display:flex;align-items:center;gap:6px;flex:1 1 0"><svg width="46" height="16"><line x1="2" y1="8" x2="32" y2="8" stroke="#1e1e1e" stroke-width="2"/><line x1="32" y1="8" x2="44" y2="2" stroke="#1e1e1e" stroke-width="2"/><line x1="32" y1="8" x2="44" y2="8" stroke="#1e1e1e" stroke-width="2"/><line x1="32" y1="8" x2="44" y2="14" stroke="#1e1e1e" stroke-width="2"/></svg><span style="font-size:10.4px;color:var(--ink);line-height:1.15">many</span></div><div style="display:flex;align-items:center;gap:6px;flex:1 1 0"><svg width="46" height="16"><line x1="2" y1="8" x2="44" y2="8" stroke="#e03131" stroke-width="2" stroke-dasharray="6 5"/></svg><span style="font-size:10.4px;color:#e03131;line-height:1.15">does not exist yet</span></div><div style="display:flex;align-items:center;gap:6px;flex:1 1 0"><svg width="46" height="16"><ellipse cx="23" cy="8" rx="20" ry="6.5" fill="none" stroke="#e03131" stroke-width="2"/></svg><span style="font-size:10.4px;color:#e03131;line-height:1.15">nobody owns it</span></div><div style="display:flex;align-items:center;gap:6px;flex:1 1 0"><svg width="46" height="16"><rect x="3" y="2" width="40" height="12" rx="3" fill="none" stroke="#f08c00" stroke-width="2" stroke-dasharray="5 4"/></svg><span style="font-size:10.4px;color:#f08c00;line-height:1.15">not ours to fix</span></div></div>
<div class="workband reveal">
  <div class="lab">The one<br>rule</div>
  <p><b>No box may be labelled "AI" and no box may carry a vendor name.</b> If you cannot say what a box does without naming a product, you have drawn a purchase order rather than an architecture. Canvas is <b>excalidraw.com</b>, nothing to install, nothing to sign in to.</p>
</div>`,

/* 9 HANDS-ON: YOUR OWN CAPABILITY */
`<div class="eyebrow reveal"><span class="dot"></span> HANDS-ON &middot; YOUR OWN CAPABILITY</div>
<h2 class="reveal">One page. One capability you actually own. One pod, one canvas.</h2>
<p class="sub reveal">The drive-thru was the worked example. This one is yours, and it is the page you leave with. Write the sentence before you draw anything, because the sentence decides the boxes.</p>
<div class="grid3 reveal" style="margin-top:8px">
  <div class="card" style="border-left:3px solid var(--cobalt);padding:8px 12px"><div class="label">THE SCENARIO</div><p style="font-size:11.4px;margin-top:3px;line-height:1.33">Pick one thing your own organisation has already been asked to add AI to. Write it in the template first:<br><span style="font-family:var(--mono);font-size:10.8px;color:var(--cobalt)">"Let us use AI to ____, so that ____."</span><br>One line, business voice, no technology in it. If the pod cannot agree quickly, draw the drive-thru instead. Everyone should be able to say the sentence from memory before a single box goes on the canvas.</p></div>
  <div class="card" style="border-left:3px solid var(--amber);padding:8px 12px"><div class="label">YOUR TASK</div><p style="font-size:11.4px;margin-top:3px;line-height:1.33">One canvas a pod. One person opens <b>excalidraw.com</b>, clicks <b>Live collaboration</b> and drops the link in your pod channel.<br>Six boxes. Name, owner, one number in each. <b>Mark every relationship 1 or N.</b> Ring in red anything nobody owns.<br>Put the sentence itself across the top of the canvas, word for word, before anything else. Export the PNG and paste it in the chat.</p></div>
  <div class="card" style="border-left:3px solid var(--sage);padding:8px 12px"><div class="label">WHAT GOOD LOOKS LIKE</div><p style="font-size:11.4px;margin-top:3px;line-height:1.33">Six boxes, not four.<br>At least one <b>NOBODY</b> still on the page at the end.<br>A number under THE RECORD that would genuinely make you switch the thing off.<br>And one relationship you had to argue about before you marked it.</p></div>
</div>
<div class="listen reveal" style="margin-top:8px">
  <div class="lsitem"><div class="lh">A box called "AI"</div><p>Or a box carrying a product name. It means the pod has drawn what it intends to buy rather than what it intends to run, and every other box on the page will be thin. Ask them to rename it to the job it does and watch the rest of the drawing change.</p></div>
  <div class="lsitem"><div class="lh">Every relationship marked 1</div><p>Nobody drew a single N, which means nobody asked how many. Volume is what turns a working demonstration into a broken shift, and it is invisible until somebody puts a crow's foot on one end of a line.</p></div>
  <div class="lsitem"><div class="lh">Six owners, no NOBODY</div><p>The pod filled every owner in to make the page look finished. Ask who told them, and the name usually comes off again. A page with no NOBODY on it is almost always a page that has not been argued over yet.</p></div>
</div>
<div class="reveal" style="display:flex;gap:9px;align-items:stretch;margin-top:8px;border:1px solid var(--line);border-radius:9px;padding:7px 11px;background:var(--card)"><div style="flex:0 0 92px;font-family:var(--mono);font-size:8.6px;letter-spacing:.06em;color:var(--soft);align-self:center;line-height:1.25">IF THE SHARED<br>CANVAS WILL NOT<br>WORK FOR YOU</div><div style="flex:1 1 0;font-size:10.5px;line-height:1.28"><b>Breakout room.</b> One person shares a screen and draws while the pod argues. Slower, but nobody is locked out.</div><div style="flex:1 1 0;font-size:10.5px;line-height:1.28"><b>Draw alone, compare after.</b> Each person draws their own six boxes, then the pod picks the page it most disagrees with.</div><div style="flex:1 1 0;font-size:10.5px;line-height:1.28"><b>Paper.</b> Draw it, photograph it, paste the photo. The notation is five marks and a pen does all five.</div></div>
<div class="actbar reveal" style="margin-top:auto"><div class="lab">The two<br>boxes at<br>the bottom</div><p>Underneath the diagram, two more boxes, and these are the payload. <b>THE NOBODY LIST:</b> every box with no owner, copied out, then one sentence saying how many of the six have none and whether any of them is the model. <b>THE ASSUMPTION IN THE SENTENCE:</b> one line naming what your ask takes for granted. On the drive-thru sentence that line was "that the problem is listening", and it was wrong. Neither box can be copied off this slide, which is exactly why they are the two we read out.</p></div>

  <div class="lab">30<br>minutes</div>

const TITLES = ["Cover","Alexa+ debrief: the case","Alexa+ read-out: three lines a pod","ROUND TABLE: the situation","ROUND TABLE: ten seats","ROUND TABLE: the brief","Break","Pod notes: what each pod came back with","Hands-on: let us build the work product","Hands-on: your own capability","Thank you"];


/* ============================================================= ENGINE */
const stage=document.getElementById('stage');
let cur=0, revealStops=[], revealIdx=0;
SLIDES.forEach((html,i)=>{ const s=document.createElement('section'); s.className='slide'; s.dataset.title=TITLES[i]||('Slide '+i); s.innerHTML=html; stage.appendChild(s); });
const slideEls=[...document.querySelectorAll('.slide')];

function buildQuiz(el){
  const kind=el.dataset.quiz; const d=QUIZ[kind]; const parent=el.parentElement;
  let opts=d.q.opts.map(o=>`<div class="qopt" data-ok="${o.ok}" onclick="quizPick(this)"><span class="k">${o.k}</span><span>${o.t}</span></div>`).join('');
  parent.innerHTML=
   `<div class="eyebrow reveal"><span class="dot"></span> ${d.eyebrow}</div>
    <h2 class="reveal">${d.title}</h2>
    <div class="quiz reveal"><p class="big" style="color:var(--ink)">${d.q.prompt}</p>
      <div class="qopts">${opts}</div>
      <div class="qfb" id="qfb-${kind}"></div></div>`;
  parent.dataset.qkind=kind;
}
function buildWidgets(s){
  const qz=s.querySelector('[data-quiz]'); if(qz) buildQuiz(qz);
  if(s.querySelector('#qchips')) buildSort();
  if(s.querySelector('#jboard')) buildJeopardy();
  if(s.querySelector('#poll')) buildPoll();
  if(s.querySelector('#scoreit')) buildScore();
  if(s.querySelector('#stepquiz')) buildStepQuiz();
  if(s.querySelector('#oibuild')) buildOI();
  if(s.querySelector('.podpad[data-pad]')) buildPodPad();
  if(s.querySelector('#walk')) buildWalk();
  if(typeof mtClearAll==='function') mtClearAll();
}
function enterHooks(s){
  if(s.querySelector('#heatmap')) heatUpdate();
  if(s.querySelector('#lenspanel')) lensRender();
  if(s.querySelector('#typed')) typeWriter();
  if(s.querySelector('.chklist')) chkInit(s);
}
function enter(n, full){
  if(!slideEls || !slideEls.length) return;
  n = Math.max(0, Math.min(slideEls.length-1, n|0));
  if(slideEls[cur]) slideEls[cur].classList.remove('active');
  cur=n; const s=slideEls[cur];
  if(!s) return;
  buildWidgets(s);
  s.classList.add('active');
  const rv=[...s.querySelectorAll('.reveal')]; revealStops=rv;
  rv.forEach(r=>r.classList.remove('show'));
  if(full){ rv.forEach(r=>r.classList.add('show')); revealIdx=rv.length; }
  else { if(rv.length){ rv[0].classList.add('show'); revealIdx=1; } else revealIdx=0; }
  document.getElementById('prog').style.width=(cur/(SLIDES.length-1)*100)+'%';
  document.getElementById('pageno').textContent=String(cur+1).padStart(2,'0');
  enterHooks(s);
}
function show(n){ enter(Math.max(0,Math.min(SLIDES.length-1,n)), false); }
function next(){
  if(revealIdx<revealStops.length){ revealStops[revealIdx].classList.add('show'); revealIdx++; return; }
  if(cur<SLIDES.length-1) enter(cur+1,false);
}
function prev(){
  if(revealIdx>1){ revealIdx--; revealStops[revealIdx].classList.remove('show'); return; }
  if(cur>0) enter(cur-1,true);   // land on previous slide's fully revealed final state
}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  const k=e.key.toLowerCase();
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'){e.preventDefault();prev();}
  else if(k==='w'){toggleWB();} else if(k==='s'){toggleSB();}
  else if(k==='t'){toggleTM();} else if(k==='g'){toggleGrid();}
  else if(k==='f'){toggleFull();} else if(e.key==='Escape'){closeOverlays();}
});
function closeOverlays(){document.getElementById('gridnav').classList.remove('on');document.getElementById('jmodal').classList.remove('open');document.getElementById('toolsmenu').classList.remove('on');}
/* ---------- grid nav ---------- */
function toggleGrid(){ const g=document.getElementById('gridnav'); const on=g.classList.toggle('on');
  if(on) document.getElementById('gwrap').innerHTML=TITLES.map((t,i)=>`<div class="gcell" onclick="jumpTo(${i})"><div class="gn">${String(i+1).padStart(2,'0')}</div><div class="gt">${t}</div></div>`).join(''); }

/* ---------- reusable inline mini countdown (default 30s, 15s on small questions) ---------- */
let mtHandles=[];
function mtClearAll(){ mtHandles.forEach(h=>clearInterval(h)); mtHandles=[]; }
function miniTimer(btn){ if(btn.dataset.run==='1')return; const secs=+btn.dataset.secs||30; let left=secs;
  btn.dataset.run='1'; btn.classList.remove('done'); btn.classList.add('run'); btn.textContent=left+'s';
  const h=setInterval(()=>{ left--;
    if(left<=0){ clearInterval(h); btn.textContent="TIME'S UP"; btn.classList.remove('run'); btn.classList.add('done'); btn.dataset.run=''; return; }
    btn.textContent=left+'s'; },1000);
  mtHandles.push(h); }

const PODK='asa_podnotes_w2d2_v2';
let podS = lsGet(PODK, {});
function podGet(p){ if(!podS[p]) podS[p]={n:6,t:{}}; return podS[p]; }
function podSave(){ lsSet(PODK, podS); }
function podRender(p){
  const g=document.querySelector('.ppgrid[data-pad="'+p+'"]'); if(!g) return;
  const st=podGet(p);
  const cols = st.n<=2?st.n : (st.n<=4?2:3);
  g.style.gridTemplateColumns='repeat('+cols+',1fr)';
  g.innerHTML='';
  for(let i=1;i<=st.n;i++){
    const d=document.createElement('div'); d.className='ppcell';
    const h=document.createElement('div'); h.className='pph'; h.textContent='Pod '+i;
    const ta=document.createElement('textarea');
    ta.placeholder='What this pod said...';
    ta.value = st.t[i]||'';
    ta.addEventListener('input',function(e){ st.t[i]=e.target.value; podSave(); });
    d.appendChild(h); d.appendChild(ta); g.appendChild(d);
  }
  const c=document.querySelector('.ppcount[data-pad="'+p+'"]');
  if(c) c.textContent = st.n+(st.n===1?' pod':' pods');
}
function podMore(p){ const st=podGet(p); if(st.n<9){ st.n++; podSave(); podRender(p); } }
function podLess(p){ const st=podGet(p); if(st.n>1){ delete st.t[st.n]; st.n--; podSave(); podRender(p); } }
function podClear(p){ const st=podGet(p); st.t={}; podSave(); podRender(p); }
function podExport(){
  let out=[];
  Object.keys(podS).sort().forEach(function(p){
    const st=podS[p]; out.push('=== BREAKOUT '+p+' ===');
    for(let i=1;i<=st.n;i++){ out.push('Pod '+i+': '+((st.t[i]||'').trim()||'(nothing recorded)')); }
    out.push('');
  });
  const blob=new Blob([out.join(String.fromCharCode(10))],{type:'text/plain'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='ASA_Week2_Day2_pod_notes.txt'; a.click(); URL.revokeObjectURL(a.href);
}

function quizPick(el){
  const box=el.closest('.qopts'); if(box.dataset.done) return; box.dataset.done=1;
  const kind=el.closest('[data-qkind]').dataset.qkind;

const LSK='asa_pods_v2'; const PODNAMES=['Pod 1','Pod 2','Pod 3','Pod 4','Pod 5','Pod 6','Pod 7','Pod 8','Pod 9'];
let teams=[], activeTeam=0;
function lsGet(k,f){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):f; }catch(e){ return f; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function loadTeams(){ teams=lsGet(LSK,[{n:'Pod 1',s:0},{n:'Pod 2',s:0},{n:'Pod 3',s:0},{n:'Pod 4',s:0},{n:'Pod 5',s:0},{n:'Pod 6',s:0}]); }
function renderTeams(){ const box=document.getElementById('teams'); const max=Math.max(...teams.map(t=>t.s),0);
  box.innerHTML='<div class="activehint">Active pod is highlighted. Click any pod to switch.</div>'+
    teams.map((t,i)=>`<div class="team ${t.s===max&&max>0?'lead':''} ${i===activeTeam?'active-team':''}" onclick="setActive(${i})">
      <div class="tt"><input class="nm" value="${t.n.replace(/"/g,'&quot;')}" onchange="renameTeam(${i},this.value)" onclick="event.stopPropagation()"><span class="sc">${t.s}</span></div>
      <div class="btns"><button onclick="event.stopPropagation();bump(${i},5)">+5</button><button onclick="event.stopPropagation();bump(${i},10)">+10</button><button onclick="event.stopPropagation();bump(${i},-5)">-5</button></div></div>`).join(''); }
function setActive(i){ activeTeam=i; renderTeams(); }
function bump(i,d){ teams[i].s=Math.max(0,teams[i].s+d); lsSet(LSK,teams); renderTeams(); }
function renameTeam(i,v){ teams[i].n=v||(PODNAMES[i]||('Pod '+(i+1))); lsSet(LSK,teams); }
function addTeam(){ if(teams.length>=8)return; teams.push({n:PODNAMES[teams.length]||('Pod '+(teams.length+1)),s:0}); lsSet(LSK,teams); renderTeams(); }
function removeTeam(){ if(teams.length<=2)return; teams.pop(); if(activeTeam>=teams.length)activeTeam=teams.length-1; lsSet(LSK,teams); renderTeams(); }
function resetScores(){ teams.forEach(t=>t.s=0); lsSet(LSK,teams); renderTeams(); }

let wbCtx,wbDrawing=false,wbColorV='#14213D',wbSizeV=3,wbErase=false,wbLast=null;
function initWB(){ const c=document.getElementById('wbc'); wbCtx=c.getContext('2d'); sizeWB();
  const pos=e=>{ const r=c.getBoundingClientRect(); const p=e.touches?e.touches[0]:e; return {x:p.clientX-r.left,y:p.clientY-r.top}; };
  const start=e=>{ wbDrawing=true; wbLast=pos(e); e.preventDefault(); };
  const move=e=>{ if(!wbDrawing)return; const p=pos(e);
    wbCtx.strokeStyle=wbColorV; wbCtx.lineWidth=wbErase?wbSizeV*6:wbSizeV; wbCtx.lineCap='round'; wbCtx.lineJoin='round';
    wbCtx.globalCompositeOperation=wbErase?'destination-out':'source-over';
    wbCtx.beginPath(); wbCtx.moveTo(wbLast.x,wbLast.y); wbCtx.lineTo(p.x,p.y); wbCtx.stroke(); wbLast=p; e.preventDefault(); };
  c.addEventListener('pointerdown',start); c.addEventListener('pointermove',move); window.addEventListener('pointerup',()=>wbDrawing=false);
}
function sizeWB(){ const c=document.getElementById('wbc'); c.width=window.innerWidth; c.height=window.innerHeight; }
function toggleWB(){ const on=document.getElementById('wb').classList.toggle('on'); document.getElementById('wbbar').classList.toggle('on',on); if(on&&!wbCtx)initWB(); }
function wbMode(m){ wbErase=(m==='erase'); document.getElementById('wbpen').style.opacity=wbErase?.5:1; document.getElementById('wberase').style.opacity=wbErase?1:.5; }
function wbColor(el){ wbErase=false; wbColorV=el.dataset.c; wbMode('pen'); [...document.querySelectorAll('.wbbar .sw')].forEach(s=>s.classList.remove('on')); el.classList.add('on'); }
function wbSize(n){ wbSizeV=n; }
function wbClear(){ wbCtx&&wbCtx.clearRect(0,0,window.innerWidth,window.innerHeight); }
window.addEventListener('resize',()=>{ if(wbCtx) sizeWB(); });

let tmTotal=30,tmLeft=30,tmInt=null,tmRun=false;
function tmFmt(s){ return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function tmRender(){ document.getElementById('tmdisp').textContent=tmFmt(tmLeft);
  const el=document.getElementById('tm'); el.classList.toggle('warn',tmLeft<=60&&tmLeft>0); el.classList.toggle('done',tmLeft<=0); }
function tmToggle(){ tmRun=!tmRun; document.getElementById('tmbtn').textContent=tmRun?'PAUSE':'START';
  if(tmRun){ tmInt=setInterval(()=>{ if(tmLeft>0){tmLeft--;tmRender();} else {clearInterval(tmInt);tmRun=false;document.getElementById('tmbtn').textContent='START';} },1000); } else clearInterval(tmInt); }
function tmReset(){ clearInterval(tmInt); tmRun=false; tmLeft=tmTotal; document.getElementById('tmbtn').textContent='START'; tmRender(); }
function tmSet(m){ tmTotal=m*60; tmLeft=m*60; clearInterval(tmInt); tmRun=false; document.getElementById('tmbtn').textContent='START'; tmRender(); }
function tmSetSec(s){ tmTotal=s; tmLeft=s; clearInterval(tmInt); tmRun=false; document.getElementById('tmbtn').textContent='START'; tmRender(); }
function tmAdjust(m){ tmLeft=Math.max(0,tmLeft+m*60); tmTotal=Math.max(0,tmTotal+m*60); tmRender(); }
function tmAdjustSec(s){ tmLeft=Math.max(0,tmLeft+s); tmTotal=Math.max(0,tmTotal+s); tmRender(); }
function openWorkTimerSec(s){ const el=document.getElementById('tm'); if(el&&!el.classList.contains('on')) el.classList.add('on'); tmSetSec(s); if(!tmRun) tmToggle(); }
function toggleTM(){ document.getElementById('tm').classList.toggle('on'); tmRender(); }

/* ---------- break clock (start / stop / reset) ---------- */
let breakTotal=10*60, breakLeft=10*60, breakInt=null, breakRun=false;
function breakRender(){ const el=document.getElementById('breakclock'); if(el) el.textContent=tmFmt(breakLeft); }
function breakAdjust(m){ breakLeft=Math.max(0,breakLeft+m*60); breakTotal=Math.max(0,breakTotal+m*60); const el=document.getElementById('breakclock'); if(el)el.style.color='var(--cobalt)'; breakRender(); }
function breakToggle(){ const btn=document.getElementById('breakbtn');
  if(breakRun){ breakRun=false; clearInterval(breakInt); if(btn)btn.textContent='RESUME'; return; }
  breakRun=true; if(btn)btn.textContent='PAUSE';
  breakInt=setInterval(()=>{ if(breakLeft>0){breakLeft--;breakRender();} else {clearInterval(breakInt);breakRun=false; if(btn)btn.textContent='START'; const el=document.getElementById('breakclock'); if(el)el.style.color='var(--clay)';} },1000); }
function breakStop(){ breakRun=false; clearInterval(breakInt); const btn=document.getElementById('breakbtn'); if(btn)btn.textContent='RESUME'; }
function breakReset(){ breakRun=false; clearInterval(breakInt); breakLeft=breakTotal; breakRender(); const el=document.getElementById('breakclock'); if(el)el.style.color='var(--cobalt)'; const btn=document.getElementById('breakbtn'); if(btn)btn.textContent='START'; }


/* ---------- confetti ---------- */
function fireConfetti(){ const c=document.getElementById('confetti'); c.classList.add('on'); c.width=innerWidth;c.height=innerHeight;
  const ctx=c.getContext('2d'); const cols=['#1B65F5','#F5A31B','#2E9E7B','#E5533D','#14213D']; let ps=[];
  for(let i=0;i<160;i++)ps.push({x:Math.random()*c.width,y:-20-Math.random()*c.height,r:4+Math.random()*6,col:cols[i%cols.length],vy:2+Math.random()*4,vx:-2+Math.random()*4,rot:Math.random()*6.28,vr:-.2+Math.random()*.4});
  let f=0; (function anim(){ ctx.clearRect(0,0,c.width,c.height); f++;
    ps.forEach(p=>{ p.y+=p.vy;p.x+=p.vx;p.rot+=p.vr; ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.col;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);ctx.restore(); });
    if(f<240)requestAnimationFrame(anim); else c.classList.remove('on'); })(); }


/* ---------- checklist ---------- */
function chkStat(list){ const items=list.querySelectorAll('.chk'); const done=[...items].filter(i=>i.classList.contains('done')).length; const fill=list.querySelector('.chkfill'); const read=list.querySelector('.chkread'); if(fill)fill.style.width=(done/items.length*100)+'%'; if(read)read.textContent= done===items.length ? 'All checked. You are ready.' : (done+' of '+items.length+' checked'); }
function chkInit(s){ s.querySelectorAll('.chklist').forEach(chkStat); }
function chkToggle(el){ el.classList.toggle('done'); chkStat(el.closest('.chklist')); }
/* ---------- score-it ---------- */
let scIdx=0;
function buildScore(){ if(document.getElementById('scoreit')) scRender(); }
function scRender(){ const box=document.getElementById('scoreit'); if(!box)return; box.dataset.done=''; const it=SCOREITEMS[scIdx];
  box.innerHTML='<div class="scq">Sample '+(scIdx+1)+' of '+SCOREITEMS.length+' · '+it.line+'</div><div class="scsub">'+it.sub+'</div>'+
  '<div class="scbtns">'+[0,25,50,75,100].map(v=>'<button class="scbtn" data-tip="'+(typeof BANDTIP!=='undefined'?BANDTIP[v]:'')+'" onclick="scorePick('+v+')">'+v+'</button>').join('')+'</div>'+
  '<div class="mtwrap"><button class="mtimer" data-secs="15" data-label="15s" onclick="miniTimer(this)">Start 15s</button><span class="mthint">Pods commit to a band before the reveal</span></div>'+
  '<div class="scfb" id="scfb"></div>'; }
function scorePick(v){ const box=document.getElementById('scoreit'); if(box.dataset.done)return; box.dataset.done=1; const it=SCOREITEMS[scIdx];
  document.querySelectorAll('#scoreit .scbtn').forEach(b=>{ if(+b.textContent===it.model)b.classList.add('correct'); });
  if(Math.abs(v-it.model)<=25) award(10);
  document.getElementById('scfb').innerHTML='<b>Model score: '+it.model+'.</b> '+it.why+(scIdx<SCOREITEMS.length-1?'<button class="scnext" onclick="scNext()">Next sample</button>':''); }
function scNext(){ if(scIdx<SCOREITEMS.length-1){ scIdx++; scRender(); } }
/* ---------- step questionnaire (Kestrel five-step slide) ---------- */
let sqIdx=0;
function buildStepQuiz(){ sqIdx=0; if(document.getElementById('stepquiz')) sqRender(); }
function sqRender(){ const box=document.getElementById('stepquiz'); if(!box)return; box.dataset.done=''; const it=STEPQUIZ[sqIdx];
  box.innerHTML='<div class="scq">Question '+(sqIdx+1)+' of '+STEPQUIZ.length+'</div>'+
  '<div class="scsub" style="margin-bottom:14px">'+it.q+'</div>'+
  '<div class="qopts" style="grid-template-columns:1fr">'+it.opts.map((o,i)=>'<div class="qopt" data-ok="'+o.ok+'" onclick="sqPick(this)"><span class="k">'+String.fromCharCode(65+i)+'</span><span>'+o.t+'</span></div>').join('')+'</div>'+
  '<div class="qfb" id="sqfb"></div>'; }
function sqPick(el){ const box=document.getElementById('stepquiz'); if(box.dataset.done)return; box.dataset.done=1;
  [...el.parentElement.children].forEach(o=>{ if(o.dataset.ok==='true') o.classList.add('correct'); });
  if(el.dataset.ok!=='true') el.classList.add('wrong'); else award(15);
  const it=STEPQUIZ[sqIdx];
  document.getElementById('sqfb').innerHTML=it.fb+(sqIdx<STEPQUIZ.length-1?'<button class="scnext" onclick="sqNext()">Next question</button>':'<div style="margin-top:12px;font-weight:700;color:var(--sage)">That is all three. Nice work.</div>'); }
function sqNext(){ if(sqIdx<STEPQUIZ.length-1){ sqIdx++; sqRender(); } }
/* ---------- work-timer nudge ---------- */
function openWorkTimer(m){ const el=document.getElementById('tm'); if(el&&!el.classList.contains('on')) el.classList.add('on'); tmSet(m); if(!tmRun) tmToggle(); }

/* ---------- boot ---------- */
loadTeams(); renderTeams(); enter(0,false);
</script>
