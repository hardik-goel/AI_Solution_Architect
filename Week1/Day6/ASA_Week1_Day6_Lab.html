<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Solution Architect · Enterprise Thinking · Frameworks &amp; Methods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F5EF; --ink:#14213D; --cobalt:#1B65F5; --amber:#F5A31B;
  --sage:#2E9E7B; --clay:#E5533D; --line:rgba(20,33,61,.14);
  --ink-soft:rgba(20,33,61,.62); --card:#FFFFFF;
  --disp:'Space Grotesk',sans-serif; --body:'Inter',sans-serif; --mono:'Space Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--body);background:var(--ink);color:var(--ink);overflow:hidden}

/* ---------- slide framework ---------- */
.stage{position:fixed;inset:0}
.slide{position:absolute;inset:0;display:none;flex-direction:column;
  padding:60px 72px 58px;background:var(--paper);overflow:hidden}
.slide.active{display:flex;animation:slideIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes slideIn{from{opacity:0;transform:translateY(10px) scale(.997)}to{opacity:1;transform:none}}
.slide::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:38px 38px;mask-image:radial-gradient(circle at 30% 20%,#000,transparent 78%)}
.slide.dark{background:#0E1730;color:#EAF0FF}
.slide.dark::before{background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px)}
.slide>*{position:relative;z-index:2}

.eyebrow{font-family:var(--mono);font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--cobalt);font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.55}}
h1{font-family:var(--disp);font-weight:700;font-size:58px;line-height:1.02;letter-spacing:-.02em}
h2{font-family:var(--disp);font-weight:700;font-size:39px;line-height:1.05;letter-spacing:-.015em;margin-bottom:8px}
h3{font-family:var(--disp);font-weight:600;font-size:22px;line-height:1.15}
p{font-size:18px;line-height:1.5;color:var(--ink-soft)}
.sub{font-size:20px;color:var(--ink-soft);line-height:1.5;max-width:1000px}
.big{font-size:22px}
strong{color:var(--ink);font-weight:600}
.slide.dark strong{color:#fff}
.mono{font-family:var(--mono)}
.grow{flex:1}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hl{background:linear-gradient(transparent 62%,rgba(245,163,27,.45) 0);padding:0 2px}
.cobalt{color:var(--cobalt)} .amber{color:var(--amber)} .sage{color:var(--sage)} .clay{color:var(--clay)}
.shimmer{background:linear-gradient(100deg,var(--ink) 30%,var(--cobalt) 50%,var(--ink) 70%);
  background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:shim 5s linear infinite}
@keyframes shim{to{background-position:-200% center}}

/* staged reveals */
.reveal{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease}
.reveal.show{opacity:1;transform:none}

/* ---------- chrome ---------- */
.daytag{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:39;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-soft);pointer-events:none}
.markbrand{position:fixed;top:14px;left:20px;z-index:40;font-family:var(--disp);font-weight:700;font-size:13px;
  letter-spacing:.02em;color:var(--ink);display:flex;align-items:center;gap:9px}
.markbrand .sq{width:15px;height:15px;border-radius:4px;background:var(--cobalt);box-shadow:5px 0 0 var(--amber),10px 0 0 var(--sage)}
.progress{position:fixed;bottom:0;left:0;height:4px;background:var(--cobalt);z-index:41;transition:width .4s ease}
.pageno{position:fixed;bottom:12px;right:18px;font-family:var(--mono);font-size:12px;color:var(--ink-soft);z-index:39}

/* discreet control launcher (facilitator only; keyboard shortcuts still work) */
.tools{position:fixed;bottom:12px;left:16px;z-index:60}
.toolstrigger{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.55);
  color:var(--ink-soft);cursor:pointer;font-size:15px;line-height:1;opacity:.28;transition:.2s;letter-spacing:1px}
.toolstrigger:hover{opacity:1;background:#fff}
.toolsmenu{position:absolute;bottom:38px;left:0;background:var(--ink);border-radius:12px;padding:7px;display:none;
  flex-direction:column;gap:4px;box-shadow:0 12px 34px rgba(0,0,0,.3);min-width:150px}
.toolsmenu.on{display:flex}
.toolsmenu .legtitle{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(255,255,255,.45);font-weight:700;padding:4px 12px 6px}
.toolsmenu button{background:transparent;border:none;color:#EAF0FF;text-align:left;font-family:var(--body);
  font-size:13.5px;padding:8px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:10px}
.toolsmenu button:hover{background:rgba(255,255,255,.12)}
.toolsmenu button .k{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:700;color:#0E1730;
  background:var(--amber);border-radius:5px;padding:2px 7px;min-width:22px;text-align:center}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;
  box-shadow:0 2px 0 var(--line);flex:1;min-width:220px;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(20,33,61,.1)}
.card h3{margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;padding:5px 11px;border-radius:999px;background:rgba(27,101,245,.1);color:var(--cobalt)}
.chip.amber{background:rgba(245,163,27,.16);color:#a56a00}
.chip.sage{background:rgba(46,158,123,.14);color:#1c7c5d}
.chip.clay{background:rgba(229,83,61,.14);color:#c23b25}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}

/* tap-to-reveal */
.tapcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;
  cursor:pointer;position:relative;overflow:hidden;transition:.2s;min-height:236px;display:flex}
.tapcard:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(20,33,61,.13)}
.tapcard .front{display:flex;flex-direction:column;height:100%;width:100%}
.tapcard .co{font-family:var(--disp);font-weight:700;font-size:20px;line-height:1.1}
.tapcard .teaser{font-size:14px;color:var(--ink-soft);margin-top:8px;line-height:1.4}
.tapcard .prompt{margin-top:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--cobalt);padding-top:10px}
.tapcard .back{position:absolute;inset:0;background:var(--ink);color:#EAF0FF;padding:18px 20px;
  transform:translateY(101%);transition:transform .4s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.tapcard.open .back{transform:none}
.tapcard .back .co{color:var(--amber);font-size:18px}
.tapcard .back p{color:rgba(234,240,255,.88);font-size:14px;line-height:1.45}
.tapcard .src{margin-top:auto;font-family:var(--mono);font-size:9.5px;color:rgba(234,240,255,.5);padding-top:8px}

/* analogy / example */
.analogy{margin-top:18px;border-left:4px solid var(--amber);background:rgba(245,163,27,.09);
  padding:15px 22px;border-radius:0 14px 14px 0}
.analogy .label{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#a56a00;font-weight:700}
.analogy p{color:var(--ink);font-size:18px;margin-top:6px}
.example{margin-top:18px;border-left:4px solid var(--cobalt);background:rgba(27,101,245,.07);
  padding:15px 22px;border-radius:0 14px 14px 0}
.example .label{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--cobalt);font-weight:700}
.example p{color:var(--ink);font-size:16.5px;margin-top:6px;line-height:1.5}
.example b{font-weight:600}
.exlist{list-style:none;margin-top:6px;display:flex;flex-direction:column;gap:7px}
.exlist li{font-size:16.5px;color:var(--ink);padding-left:22px;position:relative;line-height:1.4}
.exlist li::before{content:"";position:absolute;left:0;top:8px;width:8px;height:8px;border-radius:2px;background:var(--cobalt);transform:rotate(45deg)}
.exlist li b{color:var(--ink);font-weight:600}

/* ---------- quiz ---------- */
.quiz{margin-top:14px;max-width:940px}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.qopt{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:15px 18px;
  cursor:pointer;font-size:16.5px;transition:.15s;display:flex;gap:12px;align-items:center}
.qopt:hover{border-color:var(--cobalt);transform:translateY(-2px)}
.qopt .k{font-family:var(--mono);font-weight:700;color:var(--cobalt);font-size:14px}
.qopt.correct{background:rgba(46,158,123,.14);border-color:var(--sage)}
.qopt.wrong{background:rgba(229,83,61,.12);border-color:var(--clay);opacity:.85}
.qopt.correct::after{content:"\2713";margin-left:auto;font-weight:700;color:var(--sage);font-size:22px;line-height:1}
.qopt.wrong::after{content:"\2717";margin-left:auto;font-weight:700;color:var(--clay);font-size:20px;line-height:1}
.qfb{margin-top:14px;font-size:16px;min-height:24px;color:var(--ink-soft)}
.qfb b{color:var(--ink)}

/* ---------- ice-breaker ---------- */
.ib{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;max-width:1040px}
.ibcard{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px 20px;cursor:pointer;
  transition:.18s;position:relative;overflow:hidden;min-height:96px}
.ibcard:hover{border-color:var(--cobalt);transform:translateY(-2px)}
.ibcard .q{font-size:17.5px;color:var(--ink);font-weight:500}
.ibcard .a{font-size:15px;color:var(--sage);margin-top:10px;max-height:0;opacity:0;transition:.35s;font-weight:500}
.ibcard.open{background:rgba(46,158,123,.06);border-color:var(--sage)}
.ibcard.open .a{max-height:120px;opacity:1}

/* ---------- capability heat map ---------- */
.heatwrap{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px;max-width:960px}
.heat{border:1.5px solid var(--line);border-radius:14px;padding:16px;background:var(--card);cursor:pointer;transition:.18s;user-select:none}
.heat:hover{transform:translateY(-2px)}
.heat .cn{font-family:var(--disp);font-weight:600;font-size:17px}
.heat .cd{font-size:12.5px;color:var(--ink-soft);margin-top:3px}
.heat .lv{margin-top:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.heat[data-l="1"]{background:rgba(46,158,123,.12);border-color:var(--sage)} .heat[data-l="1"] .lv{color:#1c7c5d}
.heat[data-l="2"]{background:rgba(245,163,27,.16);border-color:var(--amber)} .heat[data-l="2"] .lv{color:#a56a00}
.heat[data-l="3"]{background:rgba(229,83,61,.16);border-color:var(--clay)} .heat[data-l="3"] .lv{color:#c23b25}
.heatread{margin-top:14px;font-size:17px;color:var(--ink)}

/* ---------- four lens ---------- */
.lenstabs{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.ltab{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:9px 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;transition:.15s}
.ltab:hover{transform:translateY(-2px)} .ltab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.lenspanel{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;min-height:150px;animation:slideIn .35s ease}
.lenspanel h3{margin-bottom:8px}
.lenspanel .verdict{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-top:12px}

/* ---------- sort game ---------- */
.sortarea{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:14px}
.bin{border:2px dashed var(--line);border-radius:16px;padding:14px;min-height:200px;background:rgba(255,255,255,.5)}
.bin h3{font-size:18px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.bin.consult{border-color:var(--cobalt)} .bin.order{border-color:var(--clay)}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px;max-width:1000px}
.qchip{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 13px;font-size:14.5px;cursor:pointer;transition:.15s}
.qchip:hover{border-color:var(--cobalt)}
.qchip.sel{border-color:var(--amber);box-shadow:0 0 0 3px rgba(245,163,27,.25)}
.qchip.placed{opacity:.55;cursor:default}
.qchip.ok{border-color:var(--sage);background:rgba(46,158,123,.1)}
.qchip.no{border-color:var(--clay);background:rgba(229,83,61,.1)}
.qchip.ok::after{content:" \2713";color:var(--sage);font-weight:700}
.qchip.no::after{content:" \2717";color:var(--clay);font-weight:700}
.binitems{display:flex;flex-direction:column;gap:8px}

/* ---------- fix statement ---------- */
.fixbox{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:980px}
.fixbox .stmt{font-size:20px;line-height:1.5}
.tech{cursor:pointer;border-bottom:2px dashed var(--clay);color:var(--clay);font-weight:600;transition:.15s}
.tech.struck{text-decoration:line-through;color:var(--ink-soft);border-bottom:none;opacity:.6}
.fixgood{margin-top:16px;padding:16px 18px;border-radius:12px;background:rgba(46,158,123,.1);border:1px solid var(--sage);font-size:18px;color:var(--ink);display:none}
.fixgood.show{display:block;animation:slideIn .4s ease}

/* ---------- jeopardy ---------- */
.jboard{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.jcol{display:flex;flex-direction:column;gap:12px}
.jhead{font-family:var(--disp);font-weight:700;font-size:15px;text-align:center;background:var(--ink);color:#fff;
  padding:12px 6px;border-radius:10px;min-height:58px;display:flex;align-items:center;justify-content:center}
.jtile{background:var(--cobalt);color:#fff;font-family:var(--disp);font-weight:700;font-size:24px;border-radius:10px;
  height:62px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.jtile:hover{background:var(--ink);transform:scale(1.03)}
.jtile.done{background:rgba(20,33,61,.12);color:var(--ink-soft);cursor:default;transform:none}
.jmodal{position:fixed;inset:0;background:rgba(14,23,48,.8);z-index:70;display:none;align-items:center;justify-content:center;padding:40px}
.jmodal.open{display:flex;animation:slideIn .3s ease}
.jcardm{background:var(--paper);border-radius:20px;padding:40px;max-width:760px;width:100%;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.jcardm .jq{font-family:var(--disp);font-size:29px;font-weight:600;line-height:1.2}
.jcardm .ja{margin-top:20px;font-size:22px;color:var(--sage);font-weight:600;display:none}
.jcardm .ja.show{display:block;animation:slideIn .3s ease}
.jbtns{margin-top:26px;display:flex;gap:12px;justify-content:center}
.jbtn{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:11px 20px;border-radius:10px;border:none;cursor:pointer}
.jbtn.rev{background:var(--amber);color:#3a2600} .jbtn.close{background:var(--ink);color:#fff}

/* poll */
.poll{margin-top:14px;max-width:860px;display:flex;flex-direction:column;gap:12px}
.prow{cursor:pointer}
.prow .ptop{display:flex;justify-content:space-between;font-size:16px;margin-bottom:5px}
.ptrack{height:26px;background:rgba(20,33,61,.08);border-radius:8px;overflow:hidden}
.pfill{height:100%;width:0;background:var(--cobalt);border-radius:8px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.prow .why{font-size:13.5px;color:var(--ink-soft);margin-top:5px;display:none}
.prow.open .why{display:block}

/* ---------- whiteboard ---------- */
#wb{position:fixed;inset:0;z-index:75;display:none;background:rgba(247,245,239,.96)}
#wb.on{display:block}
#wbc{position:absolute;inset:0;cursor:crosshair;touch-action:none}
.wbbar{position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:76;display:none;gap:8px;background:var(--ink);padding:9px 12px;border-radius:14px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.wbbar.on{display:flex}
.wbbar button{background:rgba(255,255,255,.12);border:none;color:#fff;font-family:var(--mono);font-size:11px;font-weight:700;padding:7px 10px;border-radius:8px;cursor:pointer;letter-spacing:.05em}
.wbbar button:hover{background:rgba(255,255,255,.28)}
.wbbar .sw{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.35);cursor:pointer;padding:0}
.wbbar .sw.on{border-color:#fff;transform:scale(1.15)}

/* ---------- scoreboard ---------- */
#sb{position:fixed;top:0;right:0;bottom:0;width:340px;background:#0E1730;color:#fff;z-index:66;transform:translateX(100%);transition:transform .3s ease;padding:60px 20px 20px;overflow-y:auto;box-shadow:-10px 0 40px rgba(0,0,0,.3)}
#sb.on{transform:none}
#sb h3{font-family:var(--disp);font-size:20px;margin-bottom:4px}
#sb .hint{font-size:12px;color:rgba(255,255,255,.5);margin-bottom:16px}
.team{background:rgba(255,255,255,.07);border-radius:12px;padding:12px;margin-bottom:10px}
.team.lead{box-shadow:0 0 0 2px var(--amber)}
.team .tt{display:flex;justify-content:space-between;align-items:center}
.team .nm{font-family:var(--disp);font-weight:600;font-size:16px;background:none;border:none;color:#fff;width:60%;outline:none}
.team .sc{font-family:var(--disp);font-weight:700;font-size:26px;color:var(--amber)}
.team .btns{display:flex;gap:6px;margin-top:9px}
.team .btns button{flex:1;background:rgba(255,255,255,.1);border:none;color:#fff;font-family:var(--mono);font-weight:700;padding:7px;border-radius:8px;cursor:pointer;font-size:13px}
.team .btns button:hover{background:rgba(255,255,255,.24)}
.team.active-team{background:rgba(27,101,245,.25)}
.sbctl{display:flex;gap:8px;margin-top:8px}
.sbctl button{flex:1;background:var(--cobalt);border:none;color:#fff;font-family:var(--mono);font-weight:700;padding:9px;border-radius:8px;cursor:pointer;font-size:12px}
.sbctl button.rm{background:rgba(255,255,255,.12)}
.activehint{font-size:11px;color:rgba(255,255,255,.5);margin:6px 0 2px}

/* ---------- timer ---------- */
#tm{position:fixed;bottom:20px;left:60px;z-index:67;background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;display:none;box-shadow:0 10px 30px rgba(0,0,0,.3);min-width:220px}
#tm.on{display:block}
#tm .disp{font-family:var(--disp);font-weight:700;font-size:40px;text-align:center;letter-spacing:.02em}
#tm.warn .disp{color:var(--amber)} #tm.done .disp{color:var(--clay)}
#tm .adj{display:flex;gap:6px;margin-top:6px;justify-content:center}
#tm .adj button{background:rgba(255,255,255,.12);border:none;color:#fff;font-family:var(--mono);font-weight:700;padding:6px 0;border-radius:8px;cursor:pointer;font-size:12px;flex:1}
#tm .row{display:flex;gap:6px;margin-top:6px}
#tm .row button{flex:1;background:rgba(255,255,255,.12);border:none;color:#fff;font-family:var(--mono);font-weight:700;padding:8px;border-radius:8px;cursor:pointer;font-size:12px}
#tm .row button.go{background:var(--cobalt)}
#tm .presets{display:flex;gap:6px;margin-top:6px}
#tm .presets button{flex:1;background:rgba(255,255,255,.08);border:none;color:rgba(255,255,255,.8);font-family:var(--mono);font-weight:700;padding:5px 0;border-radius:8px;cursor:pointer;font-size:11px}

/* ---------- grid nav ---------- */
.gtitle{color:#fff;font-family:var(--disp);font-size:22px;margin-bottom:20px;text-align:center}
.gwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;max-width:1200px;margin:0 auto}
.gcell{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:14px;cursor:pointer;transition:.15s;min-height:80px;color:#EAF0FF}
.gcell:hover{background:var(--cobalt);border-color:var(--cobalt)}
.gcell .gn{font-family:var(--mono);font-size:11px;color:var(--amber);font-weight:700}
.gcell .gt{font-family:var(--disp);font-size:14px;margin-top:6px;line-height:1.2}
#gridnav{position:fixed;inset:0;background:rgba(14,23,48,.94);z-index:80;display:none;padding:70px 40px 40px;overflow-y:auto}
#gridnav.on{display:block}

#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%) translateY(-30px);z-index:90;background:var(--sage);color:#fff;font-family:var(--disp);font-weight:700;font-size:18px;padding:12px 22px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#confetti{position:fixed;inset:0;z-index:85;pointer-events:none;display:none}
#confetti.on{display:block}

.hintline{font-family:var(--mono);font-size:12px;color:var(--ink-soft);margin-top:12px}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--ink-soft);font-weight:700}
ul.clean{list-style:none;margin-top:12px;display:flex;flex-direction:column;gap:11px}
ul.clean li{font-size:17.5px;color:var(--ink-soft);padding-left:26px;position:relative;line-height:1.4}
ul.clean li::before{content:"";position:absolute;left:0;top:9px;width:11px;height:11px;border-radius:3px;background:var(--cobalt);transform:rotate(45deg)}
ul.clean li b{color:var(--ink)}

/* ---------- animated cover ---------- */
.cover{position:absolute;inset:0;display:flex;align-items:center;padding:0 72px;gap:40px}
.cover .left{flex:1;max-width:620px}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;z-index:1;animation:floaty 9s ease-in-out infinite}
.blob.b1{width:360px;height:360px;background:rgba(27,101,245,.28);top:-80px;right:120px}
.blob.b2{width:300px;height:300px;background:rgba(245,163,27,.26);bottom:-70px;right:340px;animation-delay:-3s}
.blob.b3{width:240px;height:240px;background:rgba(46,158,123,.22);top:180px;right:-40px;animation-delay:-5s}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-26px)}}
.driftchip{position:absolute;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink-soft);
  background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:999px;padding:7px 13px;z-index:2;
  animation:drift 7s ease-in-out infinite;box-shadow:0 4px 16px rgba(20,33,61,.06)}
@keyframes drift{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-16px) rotate(2deg)}}
.strike{text-decoration:line-through;opacity:.55}
/* notecard */
.notecard{width:420px;background:#FFFDF7;border:1px solid var(--line);border-radius:16px;padding:26px 26px 30px;
  position:relative;z-index:3;box-shadow:0 24px 60px rgba(20,33,61,.16);transform:rotate(1.6deg);
  animation:noteIn 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes noteIn{from{opacity:0;transform:rotate(6deg) translateY(30px) scale(.94)}to{opacity:1;transform:rotate(1.6deg)}}
.notecard::before{content:"";position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:120px;height:20px;
  background:rgba(245,163,27,.5);border-radius:3px;box-shadow:0 3px 8px rgba(20,33,61,.12)}
.notelbl{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--amber);font-weight:700}
.noteline{font-family:var(--disp);font-size:19px;color:var(--ink);margin-top:14px;line-height:1.35}
.noteline .lead{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:3px}
.caret{display:inline-block;width:2px;background:var(--cobalt);margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.notestamp{position:absolute;bottom:-16px;right:-10px;font-family:var(--disp);font-weight:700;font-size:14px;
  color:#fff;background:var(--sage);padding:8px 14px;border-radius:10px;transform:rotate(-5deg);box-shadow:0 8px 20px rgba(46,158,123,.35)}
.riseUp{animation:riseUp .7s cubic-bezier(.2,.8,.2,1) both}
.riseUp.d1{animation-delay:.08s}.riseUp.d2{animation-delay:.18s}.riseUp.d3{animation-delay:.3s}.riseUp.d4{animation-delay:.42s}
@keyframes riseUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

@media (max-width:900px){
  .slide{padding:56px 22px 50px} h1{font-size:36px} h2{font-size:27px}
  .qopts,.grid2,.grid3,.grid4,.heatwrap,.sortarea,.ib{grid-template-columns:1fr}
  .cover{flex-direction:column;justify-content:center;padding:60px 22px;gap:24px}
  .notecard{width:100%;transform:none} #sb{width:100%}
}

/* flip cards */
.flipgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.flip{height:210px;perspective:1200px;cursor:pointer}
.flipinner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.flip-on .flipinner{transform:rotateY(180deg)}
.flipface{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:16px;padding:20px 22px;border:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;box-shadow:0 2px 0 var(--line)}
.flipfront{background:var(--card)}
.flipfront .fh{font-family:var(--disp);font-weight:700;font-size:20px}
.flipfront .fsub{font-size:14px;color:var(--ink-soft);margin-top:8px}
.flipfront .fhint{margin-top:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--cobalt);padding-top:12px}
.flipback{background:var(--ink);color:#EAF0FF;transform:rotateY(180deg)}
.flipback p{color:rgba(234,240,255,.9);font-size:14.5px;line-height:1.45}
.flipback .fh{color:var(--amber);font-family:var(--disp);font-weight:700;font-size:16px;margin-bottom:6px}
/* checklist */
.chklist{margin-top:14px;max-width:880px}
.chk{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:9px;cursor:pointer;font-size:16.5px;transition:.15s}
.chk:hover{border-color:var(--cobalt)}
.chk .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:13px}
.chk.done{background:rgba(46,158,123,.1);border-color:var(--sage)}
.chk.done .box{background:var(--sage);border-color:var(--sage)}
.chk.done .box::after{content:"\2713"}
.chkbar{height:8px;background:rgba(20,33,61,.08);border-radius:6px;overflow:hidden;margin-top:6px}
.chkfill{height:100%;width:0;background:var(--sage);transition:width .4s}
.chkread{margin-top:8px;font-family:var(--mono);font-size:12px;color:var(--ink-soft)}
/* score-it */
.scoreit{margin-top:14px;max-width:960px}
.scq{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;margin-bottom:8px}
.scsub{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--cobalt);border-radius:12px;padding:18px 20px;font-size:17px;color:var(--ink);line-height:1.5}
.scbtns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.scbtn{font-family:var(--disp);font-weight:700;font-size:20px;padding:11px 20px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;transition:.15s}
.scbtn:hover{border-color:var(--cobalt);transform:translateY(-2px)}
.scbtn.correct{background:rgba(46,158,123,.14);border-color:var(--sage)}
.scfb{margin-top:14px;font-size:16px;color:var(--ink-soft);line-height:1.5;min-height:20px}
.scfb b{color:var(--ink)}
.scnext{margin-left:10px;font-family:var(--mono);font-weight:700;font-size:12px;background:var(--ink);color:#fff;border:none;padding:8px 14px;border-radius:8px;cursor:pointer}

/* ---------------- controlled fill ----------------
   .grow is dead on these slides: higher-specificity .slide>.grid2 rules beat it.
   These opt-in classes let a container absorb slack, and are applied ONLY where the
   cards carry enough content that growing them does not open a hole inside the card. */
.slide>.fillgrid{flex:1 1 auto!important;min-height:0!important}
.slide>.grid2.fillgrid,.slide>.grid3.fillgrid,.slide>.vs.fillgrid{grid-auto-rows:1fr;align-content:stretch}
.slide>.fillgrid>.card,.slide>.fillgrid>.vscard{height:auto;min-height:0}
/* a table absorbing slack: the data rows share it, head and note stay fixed */
.slide>.tablefill{flex:1 1 auto!important;min-height:0!important;display:flex;flex-direction:column}
.slide>.tablefill>.maprow3{flex:1 1 auto;align-items:center}
.slide>.tablefill>.maprow3.maphead,.slide>.tablefill>.mapnote{flex:0 0 auto}
.miss{font-family:var(--mono);font-size:8.8px;letter-spacing:.04em;color:var(--clay);font-weight:700;margin-top:6px;padding-top:5px;border-top:1px solid var(--line)}
/* the answer-sheet preview strip */
.sheet{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:9px}
.shcell{border:1px solid var(--line);border-radius:9px;background:var(--paper2);padding:7px 8px}
.shh{font-family:var(--mono);font-size:7.8px;letter-spacing:.06em;text-transform:uppercase;color:var(--cobalt);font-weight:700;line-height:1.25}
.shl{margin-top:6px;height:2px;background:var(--line);border-radius:2px}
.shl+.shl{margin-top:5px}
.shl.sh2{width:78%}
.shl.sh3{width:52%}
.shx{font-size:9.6px;line-height:1.32;color:var(--ink-soft);margin-top:5px;font-style:italic}

/* ---------------- WORKED EXAMPLE: ask then reveal ---------------- */
#walk{display:flex;flex-direction:column;gap:9px;min-height:0}
.wkbar{display:flex;align-items:center;gap:12px}
.wksec{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--cobalt);font-weight:700;white-space:nowrap}
.wkdots{display:flex;gap:5px;flex:1}
.wkdot{width:13px;height:13px;border-radius:50%;border:2px solid var(--line);cursor:pointer;background:var(--card)}
.wkdot.seen{background:var(--sage);border-color:var(--sage)}
.wkdot.cur{border-color:var(--cobalt);box-shadow:0 0 0 3px rgba(27,101,245,.16)}
.wkq{background:var(--ink);border-radius:14px;padding:14px 16px;flex:0 0 auto}
.wkq .wqh{font-family:var(--mono);font-size:9.2px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-weight:700;margin-bottom:5px}
.wkq p{font-family:var(--disp);font-size:17.5px;font-weight:700;line-height:1.32;color:#EAF0FF;margin:0}
.wkans{display:grid;grid-template-columns:1.62fr 1fr;gap:10px;flex:1 1 auto;min-height:0}
.wkgood{border:1px solid var(--line);border-left:4px solid var(--sage);border-radius:11px;padding:11px 13px;background:var(--card);overflow:hidden}
.wkthin{border:1px solid var(--line);border-left:4px solid var(--clay);border-radius:11px;padding:11px 13px;background:rgba(199,84,58,.05);overflow:hidden}
.wkl{font-family:var(--mono);font-size:8.6px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-bottom:5px}
.wkgood .wkl{color:var(--sage)}
.wkthin .wkl{color:var(--clay)}
.wkgood p,.wkthin p{font-size:12px;line-height:1.42;margin:0;color:var(--ink)}
.wkthin p{color:var(--ink-soft)}
.wkhide{display:flex;align-items:center;justify-content:center;text-align:center;border:2px dashed var(--line);border-radius:11px;padding:14px;font-size:12.4px;color:var(--ink-soft);font-style:italic;flex:1 1 auto;min-height:0}
.wknav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wkbtn{font-family:var(--disp);font-size:12.5px;font-weight:700;padding:8px 15px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.wkbtn.rev{background:var(--cobalt);color:#fff;border-color:var(--cobalt)}
.wkok{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--sage);font-weight:700}

/* ===== WEEK 2 PATCH: 100%-zoom fit ===== */
.slide{padding:36px 54px 36px}
h1{font-size:46px}
h2{font-size:33px;margin-bottom:7px}
.sub{font-size:16.5px;line-height:1.45;max-width:1180px}
.eyebrow{font-size:10.5px;letter-spacing:.18em}
.card{padding:15px 17px;border-radius:13px}
.chip{font-size:10px;padding:4px 9px}
.grid2{gap:13px;margin-top:11px}
.grid3{gap:12px;margin-top:11px}
.analogy{margin-top:12px;padding:11px 15px}
.analogy p{font-size:13px;line-height:1.45}
.example{margin-top:12px;padding:11px 15px}
.exlist{margin-top:5px;gap:5px}
.exlist li{font-size:13.5px;padding-left:17px;line-height:1.42}
.exlist li::before{top:6px;width:7px;height:7px}
.tapcard{min-height:188px;padding:15px 17px;border-radius:13px}
.tapcard .co{font-size:16px}
.tapcard .teaser{font-size:12.5px;margin-top:6px}
.tapcard .prompt{font-size:9px}
.tapcard .back{padding:13px 15px}
.tapcard .back .co{font-size:14.5px}
.tapcard .back p{font-size:13px;line-height:1.42}
.tapcard.mini{min-height:116px}
.tapcard.mini .co{font-size:14px}
.tapcard.mini .teaser{font-size:11.5px;margin-top:4px}
.tapcard.mini .back .co{font-size:13px}
.tapcard.mini .back .exlist li{font-size:12.5px;line-height:1.4}
.hintline{font-size:10.5px;margin-top:8px}
.fixbox{padding:14px 16px;margin-top:10px}
.lenspanel{padding:18px 20px;min-height:200px;margin-top:11px}
.lenstabs{gap:7px}
.flipgrid{gap:12px;margin-top:11px}
.slide>.flipgrid:last-child{margin-top:14px;flex:1 1 auto;min-height:0;grid-auto-rows:1fr;align-content:stretch}
.slide>.flipgrid:last-child>.flip{height:auto;min-height:0}
.slide>.flipgrid:last-child>.flip>.flipinner{height:100%}
.flipgrid .flipface{display:flex;flex-direction:column}
.flipgrid .flipfront .fhint{margin-top:auto}
.rbadge{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.08em;
 padding:2px 7px;border-radius:20px;margin-right:6px;vertical-align:1px;font-weight:700}
.rbadge.core{background:rgba(27,101,245,.13);color:var(--cobalt)}
.rbadge.vec{background:rgba(46,158,123,.16);color:var(--sage)}
.rbadge.vec.primary{background:var(--amber);color:#2a1d00}
.brkband{display:flex;align-items:center;gap:16px;margin-top:10px;padding:13px 18px;
 border-radius:12px;background:rgba(245,163,27,.12);border:1px solid rgba(245,163,27,.4)}
.brkband .brkl{font-family:var(--disp);font-weight:800;font-size:16px;color:var(--ink);white-space:nowrap}
.brkband p{margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.4}
.podpad{margin-top:12px;flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.ppbar{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.pplab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-right:auto}
.ppbtn{font-family:var(--mono);font-size:11px;padding:5px 11px;border-radius:7px;cursor:pointer;
 border:1px solid var(--line);background:var(--card);color:var(--ink)}
.ppbtn:hover{border-color:var(--cobalt);color:var(--cobalt)}
.ppbtn.clear:hover{border-color:var(--clay);color:var(--clay)}
.ppcount{font-family:var(--mono);font-size:11px;color:var(--ink-soft);min-width:56px;text-align:center}
.ppgrid{display:grid;gap:10px;flex:1 1 auto;min-height:0}
.ppcell{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);
 border-radius:11px;overflow:hidden;min-height:0}
.ppcell .pph{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
 color:#fff;background:var(--ink);padding:5px 10px}
.ppcell textarea{flex:1 1 auto;min-height:0;border:0;outline:0;resize:none;padding:9px 11px;
 font-family:var(--body);font-size:13px;line-height:1.45;color:var(--ink);background:transparent}
.ppcell textarea::placeholder{color:var(--ink-soft);opacity:.55}
.scoreit{margin-top:10px;max-width:1180px}
.scq{font-size:10px;margin-bottom:6px}
.scsub{padding:16px 18px;font-size:15px;border-radius:10px}
.scbtns{gap:8px;margin-top:10px}
.scbtn{font-size:18px;padding:11px 20px;border-radius:10px}
.scfb{font-size:13.5px;margin-top:12px;line-height:1.5;min-height:112px}

/* ===== WEEK 2 PATCH: dark-card contrast fix =====
   .exlist li is hard-coded var(--ink); on the navy .tapcard .back it was
   dark-on-dark and invisible. Fix globally so future decks inherit it. */
.tapcard .back .exlist li{color:rgba(234,240,255,.9)}
.tapcard .back .exlist li b{color:#fff}
.tapcard .back .exlist li::before{background:var(--amber)}
.tapcard .back ul{margin:0;padding:0;list-style:none}
.tapcard .back .exlist li span{color:#9DBBF5 !important}

/* ===== WEEK 2 PATCH: activity bar + artefact strip (fill the dead space) ===== */
.actbar{margin-top:auto;display:flex;align-items:center;gap:15px;background:var(--paper2);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:12px;padding:13px 17px}
.actbar .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);font-weight:800;white-space:nowrap;line-height:1.4}
.actbar p{font-size:13.5px;color:var(--ink);line-height:1.45;margin:0}
.actbar .mini{margin-left:auto;white-space:nowrap;font-family:var(--mono);font-weight:700;font-size:10.5px;background:var(--ink);color:#fff;border:none;padding:9px 14px;border-radius:8px;cursor:pointer}
.actbar .mini:hover{background:var(--cobalt)}
.bandstrip{margin-top:12px;flex:1 1 auto;display:flex;flex-direction:column;background:var(--paper2);border:1px solid var(--line);border-left:4px solid var(--sage);border-radius:12px;padding:13px 17px;min-height:120px}
.bandstrip .bl{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--sage);font-weight:800}
.bandcells{display:grid;gap:10px;margin-top:9px;flex:1}
.bandcell{background:#fff;border:1px dashed var(--line);border-radius:9px;padding:9px 12px;display:flex;flex-direction:column}
.bandcell .bh{font-family:var(--mono);font-size:9px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.12em;font-weight:700}
.bandcell .bw{flex:1;min-height:34px;border-bottom:1px dotted var(--line);margin-top:7px;background:repeating-linear-gradient(transparent,transparent 29px,var(--line) 29px,var(--line) 30px)}
.bandcell .bx{font-size:12px;color:var(--ink-soft);margin-top:5px;line-height:1.35;font-style:italic}
.selfaudit{margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.saitem{background:var(--paper2);border:1px solid var(--line);border-top:3px solid var(--cobalt);border-radius:11px;padding:11px 14px}
.saitem .sh{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--cobalt);font-weight:800}
.saitem p{font-size:12.5px;line-height:1.4;margin-top:6px;color:var(--ink)}
.quiz{margin-top:12px}
/* let the primary content grid absorb slack so space is distributed, not pooled at one gap */
.slide>.grid2,.slide>.grid3{flex:0 1 auto}
.listen{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.lsitem{background:#fff;border:1px solid var(--line);border-top:3px solid var(--clay);border-radius:11px;padding:11px 14px}
.lsitem .lh{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--clay);font-weight:800}
.lsitem p{font-size:12.5px;line-height:1.4;margin-top:6px;color:var(--ink)}
.stretchcol>.tapcard{flex:1}
.slidewrap{display:flex;flex-direction:column;flex:1}
.quiz .big{font-size:19px;line-height:1.4}
.qopt{font-size:14.5px;padding:12px 15px}
.jboard{margin-top:12px}
/* ===== WEEK 2 PATCH: band tooltips, inline mini timer, oi prev ===== */
.scbtn{position:relative}
.scbtn::after{content:attr(data-tip);position:absolute;top:calc(100% + 10px);left:0;transform:translateY(-4px);background:var(--ink);color:#EAF0FF;font-family:var(--body);font-weight:500;font-size:12px;letter-spacing:0;text-transform:none;line-height:1.45;padding:10px 13px;border-radius:9px;width:268px;opacity:0;pointer-events:none;transition:.16s;box-shadow:0 12px 30px rgba(20,33,61,.26);z-index:40}
.scbtn:hover::after{opacity:1;transform:translateY(0)}
.mtwrap{display:flex;align-items:center;gap:10px;margin-top:12px}
.mtimer{font-family:var(--mono);font-weight:700;font-size:11.5px;letter-spacing:.1em;background:var(--ink);color:#fff;border:none;padding:9px 16px;border-radius:9px;cursor:pointer;min-width:110px;transition:.15s}
.mtimer:hover{background:var(--cobalt)}
.mtimer.run{background:var(--amber)}
.mtimer.done{background:var(--clay)}
.mthint{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);letter-spacing:.05em}
.oiprev{font-family:var(--mono);font-weight:700;font-size:10.5px;background:transparent;color:var(--ink-soft);border:1.5px solid var(--line);padding:8px 13px;border-radius:8px;cursor:pointer;transition:.15s}
.oiprev:hover{border-color:var(--cobalt);color:var(--cobalt)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:11px}
.vscard{border-radius:13px;padding:14px 16px;border:1px solid var(--line)}
.vscard.bad{background:rgba(199,84,58,.07);border-left:4px solid var(--clay)}
.vscard.good{background:rgba(46,158,123,.09);border-left:4px solid var(--sage)}
.vscard .vh{font-family:var(--disp);font-size:21px;font-weight:800}
.vscard.bad .vh{color:var(--clay)}
.vscard.good .vh{color:var(--sage)}
.vsq{font-size:13.5px;line-height:1.5;margin-top:8px;color:var(--ink);background:#fff;border-radius:9px;padding:11px 13px}
.vsq u{text-decoration:none;border-bottom:2.5px solid var(--amber);padding-bottom:1px;font-weight:600}
.vswhy{margin-top:9px;font-size:12.5px;line-height:1.45;color:var(--ink-soft)}
.vswhy b{color:var(--ink)}
/* mid-band row on the 0-vs-100 slide */
.mid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.midc{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card)}
.midc .mh{font-family:var(--disp);font-size:17px;font-weight:800}
.midc.m25{border-left:4px solid var(--clay)}.midc.m25 .mh{color:var(--clay)}
.midc.m50{border-left:4px solid var(--amber)}.midc.m50 .mh{color:var(--amber)}
.midc.m75{border-left:4px solid var(--sage)}.midc.m75 .mh{color:var(--sage)}
.midc .mq{font-size:12.5px;line-height:1.45;margin-top:7px;background:var(--paper2);border-radius:8px;padding:9px 11px;color:var(--ink)}
.midc .mq u{text-decoration:none;border-bottom:2px solid var(--amber);padding-bottom:1px;font-weight:600}
.midc .mw{margin-top:7px;font-size:11.5px;line-height:1.4;color:var(--ink-soft)}
.midc .mw b{color:var(--ink)}
/* slide 3 recap grid grows into the space */
.slide>.grid2.recapgrid{flex:1 1 auto;max-height:440px;align-content:stretch;grid-auto-rows:1fr}
.recapgrid>.card{display:flex;flex-direction:column}
/* ---- Week 1 Day 2: sort-game compaction + trailing-element pinning ---- */
.bin{min-height:150px;padding:12px;border-radius:13px}
.qchip{padding:8px 12px;font-size:13.5px}
.qchipwrap{margin-top:11px;display:flex;flex-wrap:wrap;gap:8px}
/* pin the last block to the bottom so slack sits between content, not after it */
.slide>.analogy:last-child,.slide>.listen:last-child,.slide>.workband:last-child,.slide>.example:last-child,.slide>.actbar:last-child{margin-top:auto}
.workband{display:flex;align-items:center;gap:14px;background:var(--paper2);border:2px dashed var(--line);border-radius:12px;padding:14px 18px;margin-top:12px}
/* let the primary grid on a sparse slide take the slack */
.slide>.grid2.grow,.slide>.grid3.grow{flex:1 1 auto;max-height:230px;align-content:stretch;grid-auto-rows:1fr}
/* worked-example artefact: the map row the story produces */
.artefact{margin-top:11px;border:1px solid var(--line);border-radius:12px;background:var(--card);
 padding:12px 15px 13px;flex:0 0 auto}
.artlab{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
 color:var(--cobalt);margin-bottom:8px}
.artrow{display:grid;grid-template-columns:1.1fr 1.9fr .9fr;gap:14px;padding:7px 0;
 border-top:1px solid var(--line);font-size:12.5px;line-height:1.4;align-items:start}
.artrow.arthead{border-top:0;padding-top:0;font-family:var(--mono);font-size:9.5px;
 letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft)}
.artnote{margin:9px 0 0;font-size:12px;line-height:1.45;color:var(--ink-soft);
 border-top:1px dashed var(--line);padding-top:8px}
.slide>.grid2.grow>.card,.slide>.grid3.grow>.card{display:flex;flex-direction:column}
/* content-rich worked-example grid: allowed to grow further than the default cap */
.slide>.grid2.grow.tall{max-height:48vh}
/* expected-deliverable skeleton */
.deliv{margin-top:10px;border:1px solid var(--line);border-radius:12px;background:var(--paper2);
 padding:11px 15px 12px;flex:0 0 auto}
.dlab{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
 color:var(--cobalt);margin-bottom:7px}
.dpre{margin:0;font-family:var(--mono);font-size:11.5px;line-height:1.55;color:var(--ink);
 white-space:pre-wrap;word-break:break-word}
.dpre b{color:var(--sage)}
.maprow3{display:grid;grid-template-columns:0.85fr 0.8fr 1.5fr 1.25fr;gap:13px;padding:7px 0;
 border-top:1px solid var(--line);font-size:12px;line-height:1.38;align-items:start}
.maprow3>div:nth-child(2){color:var(--ink-soft);font-family:var(--mono);font-size:10.5px}
.maprow3>div:nth-child(3){color:var(--cobalt)}
.maprow3>div:nth-child(4){color:var(--clay)}
.maprow3.maphead{border-top:0;font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);padding-top:2px}
.maprow3.maphead>div{color:var(--ink-soft)!important;font-size:9px!important}
@media (max-height:880px){.maprow3{padding:5px 0;font-size:11.3px}}
@media (max-height:720px){.maprow3{padding:3px 0;font-size:10.4px;gap:10px}}
/* short-viewport scaling: the sort game and the review checklist are the two densest slides */
/* this week's focus-letter panel (unused in this deck) */
.vecwrap{margin-top:10px;background:var(--ink);border-radius:16px;padding:20px 26px 22px}
.veclab{font-family:var(--mono);font-size:11px;letter-spacing:.17em;text-transform:uppercase;
 color:var(--amber);margin-bottom:12px}
.vecrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.vecrow .vl{font-family:var(--disp);font-weight:700;font-size:clamp(30px,4.6vh,46px);
 color:#EAF0FF;line-height:1;padding:4px 10px;border-radius:10px}
.vecrow .vl.on{background:var(--amber);color:#2a1d00}
.vecrow .vl.second{color:var(--sage)}
.vecrow .vd{color:rgba(234,240,255,.42);font-size:clamp(20px,3vh,30px);line-height:1}
.vecsub{margin:14px 0 0;font-size:clamp(12.5px,1.8vh,15px);line-height:1.5;color:rgba(234,240,255,.84)}
.vecsub b{color:#fff}
/* five-places -> real-example mapping */
.maprow{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:7px 0;
 border-top:1px solid var(--line);font-size:12px;line-height:1.4;align-items:start}
.maprow:first-of-type{border-top:0}
.maprow.maphead{border-top:0;padding-top:2px;font-family:var(--mono);font-size:9px;
 letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft)}
.maprow>div:last-child{color:var(--cobalt)}
.maprow.maphead>div:last-child{color:var(--ink-soft)}
.kindcol{display:flex;flex-direction:column;gap:10px;min-height:0}
.kind{background:var(--card);border:1px solid var(--line);border-radius:11px;
 padding:11px 14px;flex:1 1 auto;display:flex;flex-direction:column}
.kind.sourced{border-left:3px solid var(--sage)}
.kind.flagged{border-left:3px solid var(--amber)}
.kind.invented{border-left:3px solid var(--clay)}
.kind .kh{margin-bottom:5px}
.kind p{margin:0;font-size:12.5px;line-height:1.45;color:var(--ink)}
.example .mapnote,.mapnote{margin:9px 0 0;font-size:11.5px;line-height:1.45;color:var(--ink-soft);
 border-top:1px dashed var(--line);padding-top:8px}
/* peer review band */
.peerband{margin-top:10px;border-radius:12px;padding:11px 16px;flex:0 0 auto;
 background:rgba(46,158,123,.1);border:1px solid rgba(46,158,123,.38)}
.pbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;color:var(--sage);margin-bottom:5px}
.peerband p{margin:0;font-size:12.5px;line-height:1.45;color:var(--ink)}
@media (max-height:940px){.peerband{padding:9px 14px;margin-top:8px}.peerband p{font-size:12px}}
@media (max-height:830px){.peerband{padding:7px 12px;margin-top:6px}.peerband p{font-size:11.5px;line-height:1.38}}
/* the breakout slide carries the most blocks, so it scales with viewport height */
.dpre{font-size:clamp(9px,1.3vh,11.5px);line-height:1.5}
@media (max-height:940px){
  .slide>.grid3.grow.bkgrid{max-height:150px}
  .deliv{padding:8px 13px 9px;margin-top:8px}
  .dlab{margin-bottom:5px}
  .brkband{padding:10px 16px;margin-top:8px}
}
@media (max-height:830px){
  .slide>.grid3.grow.bkgrid{max-height:112px}
  .dpre{font-size:8.6px;line-height:1.36}
  .deliv{margin-top:4px;padding:5px 10px 6px}
  .peerband{margin-top:4px;padding:6px 11px}
  .peerband p{font-size:11px;line-height:1.32}
  .slide>.workband{padding:8px 13px}
  .brkband{padding:6px 13px;margin-top:4px}
  .brkband .brkl{font-size:14px}
  .brkband{padding:8px 14px;margin-top:6px}
  .deliv{margin-top:6px;padding:7px 12px 8px}
  .slide>.workband{padding:10px 14px}
}
.slide>.flipgrid{flex:0 1 auto}
/* six-item reference strip (unused in this deck) */
.vecstrip{margin-top:12px;display:grid;grid-template-columns:repeat(6,1fr);gap:9px}
.vs6{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--line);border-radius:11px;padding:13px 14px;display:flex;flex-direction:column}
.vs6 .vl{font-family:var(--disp);font-size:22px;font-weight:800;color:var(--ink-soft);line-height:1}
.vs6 .vt{font-size:11.5px;line-height:1.38;margin-top:7px;color:var(--ink-soft)}
.vs6.on{border-top-color:var(--amber);background:rgba(245,163,27,.09)}
.vs6.on .vl{color:var(--amber)}
.vs6.on .vt{color:var(--ink);font-weight:500}
/* four-blocks grid absorbs the space the two case cards used to take */
.slide>.blockgrid{flex:1 1 auto;max-height:540px;align-content:stretch;grid-auto-rows:1fr}
.blockgrid>.tapcard.mini{min-height:0}
.blockgrid>.tapcard.mini .teaser{font-size:12.5px;margin-top:7px}
.blockgrid>.tapcard.mini .back .exlist li{font-size:13px;line-height:1.45}
/* cost / predictability rail on the four-blocks slide */
.costrail{margin-top:auto;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;background:var(--paper2);border:1px solid var(--line);border-radius:13px;padding:14px 18px}
.crlab{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;line-height:1.7;font-weight:700}
.crend.left .crlab{color:var(--sage);text-align:right}
.crend.right .crlab{color:var(--clay)}
.crsteps{display:flex;align-items:center;justify-content:center;gap:10px}
.crstep{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 15px;font-family:var(--disp);font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap}
.crn{display:inline-flex;align-items:center;justify-content:center;width:21px;height:21px;border-radius:6px;background:var(--ink);color:#fff;font-family:var(--mono);font-size:11px}
.crarrow{color:var(--ink-soft);font-size:17px}
/* band ladder reference strip */
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:12px}
.ldc{background:var(--paper2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;text-align:center}
.ldc .ln{font-family:var(--disp);font-size:19px;font-weight:800;line-height:1}
.ldc .lt{font-size:11px;color:var(--ink-soft);margin-top:5px;line-height:1.3}
.ldc.b0{border-top:3px solid var(--clay)}.ldc.b25{border-top:3px solid var(--clay)}
.ldc.b50{border-top:3px solid var(--amber)}.ldc.b75{border-top:3px solid var(--sage)}
.ldc.b100{border-top:3px solid var(--sage)}
/* ===== WEEK 2 PATCH: orchestration-intelligence builder ===== */
.oibuild{margin-top:11px;display:grid;grid-template-columns:1.3fr 1fr;gap:14px;align-items:stretch;flex:1 1 auto}
.oiq{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--cobalt);border-radius:13px;padding:16px 18px;min-height:0}
.oistep{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
.oiprompt{font-size:14px;color:var(--ink);line-height:1.4;margin-top:6px;font-weight:600}
.oiopt{margin-top:9px;background:var(--paper2);border:1.5px solid var(--line);border-radius:9px;padding:8px 11px;font-size:12.5px;cursor:pointer;transition:.15s;line-height:1.35}
.oiopt:hover{border-color:var(--cobalt);transform:translateX(2px)}
.oiopt.ok{background:rgba(46,158,123,.15);border-color:var(--sage)}
.oiopt.no{background:rgba(199,84,58,.1);border-color:var(--clay);opacity:.7}
.oifb{margin-top:9px;font-size:12.5px;color:var(--ink-soft);line-height:1.4;min-height:16px}
.oifb b{color:var(--ink)}
.oinext{margin-left:8px;font-family:var(--mono);font-weight:700;font-size:10.5px;background:var(--ink);color:#fff;border:none;padding:6px 11px;border-radius:7px;cursor:pointer}
.oidef{background:var(--ink);color:#EAF0FF;border-radius:13px;padding:16px 18px;min-height:0}
.oidef .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);font-weight:700}
.oifrag{margin-top:9px;font-size:12.5px;line-height:1.45;padding-left:16px;position:relative;color:rgba(234,240,255,.92);animation:slideIn .3s ease}
.oifrag b{color:#fff}
#oifrags:empty::before{content:"Answer the first question and the definition starts building here, one line at a time.";display:block;margin-top:14px;font-size:12.5px;line-height:1.5;color:rgba(234,240,255,.42);font-style:italic}
.oifrag::before{content:"";position:absolute;left:0;top:6px;width:7px;height:7px;border-radius:2px;background:var(--amber);transform:rotate(45deg)}
.oidone{margin-top:11px;padding-top:10px;border-top:1px solid rgba(234,240,255,.22);font-size:13px;color:#fff;font-weight:600;line-height:1.45}

.qrcard{display:flex;flex-direction:column;background:var(--ink);border-radius:14px;
 padding:16px 18px;align-items:center;text-align:center;justify-content:center;min-height:0}
.qrlab{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
 color:var(--amber);margin-bottom:10px}
.qrbox{background:#fff;border-radius:10px;padding:8px;width:min(190px,30vh);aspect-ratio:1;
 display:flex;align-items:center;justify-content:center}
.qrbox svg{width:100%;height:100%;display:block}
.qrtxt{margin:10px 0 0;font-size:12.5px;line-height:1.45;color:rgba(234,240,255,.86);max-width:230px}
.qrtxt b{color:#fff}
@media (max-height:830px){.qrbox{width:min(150px,26vh)}.qrcard{padding:12px 14px}.qrtxt{font-size:11.5px}}
@media (max-height:880px){
  .bin{min-height:104px}
  .qchip{padding:6px 10px;font-size:12.5px}
  .maprow{padding:5px 0;font-size:11.5px}
  .mapnote{font-size:11px;padding-top:6px;margin-top:6px}
}
@media (max-height:720px){
  .bin{min-height:72px}
  .bintitle{font-size:12px}
  .qchip{padding:5px 9px;font-size:11.5px}
  .bins{gap:8px;margin-top:8px!important}
  .maprow{padding:4px 0;font-size:11px;gap:10px}
  .example .label{font-size:9px;margin-bottom:4px}
  .mapnote{font-size:10.5px}
  .slide>.listen{margin-top:7px}
  .lsitem p{font-size:11.5px;line-height:1.35}
}
@media (max-height:700px){
  .maprow{padding:1px 0;font-size:9.6px;gap:7px;line-height:1.26}
  .cover .driftchip{display:none}
  .slide>.actbar{padding:8px 13px}
  .slide>.actbar p{font-size:11px;line-height:1.34}
  .maprow.maphead{font-size:8px}
  .slide>.example{padding:9px 12px}
  .example>p[style*="font-size:12px"]{font-size:10.5px!important;margin-bottom:4px!important}
  .mapnote{font-size:10px;padding-top:5px;margin-top:5px}
  .slide>.grid3.grow.bkgrid{max-height:96px}
  .slide>.grid3.grow.bkgrid .card{padding:8px 11px!important}
  .slide>.grid3.grow.bkgrid .card p{font-size:11px!important;line-height:1.32!important}
  .slide>.workband{padding:6px 12px}
  .slide>.workband div[style*="font-size:22px"]{font-size:16px!important}
  .slide>.workband p{font-size:11px!important}
  .slide h2{font-size:28px}
}
/* ---- narrow CSS viewports (browser zoom on a normal laptop) ---- */
@media (max-width:1400px){
  .slide h2{font-size:28px}
  .slide>p.sub{font-size:12.4px!important;line-height:1.34}
  .maprow{padding:4px 0;font-size:10.6px;gap:10px;line-height:1.33}
  .maprow3{padding:4px 0;font-size:10.6px;gap:9px;line-height:1.33}
  .maprow.maphead,.maprow3.maphead{font-size:8.4px}
  .mapnote{font-size:10px;padding-top:5px;margin-top:5px}
  .lsitem p{font-size:10.4px;line-height:1.28}
  .lsitem .lh{font-size:10.4px}
  .slide>.listen{margin-top:6px}
  .slide>.actbar{padding:8px 13px}
  .slide>.actbar p{font-size:10.8px;line-height:1.32}
  .slide>.grid3>.card{padding:9px 11px!important}
  .slide>.grid3>.card p{font-size:10.9px!important;line-height:1.32!important}
  .slide>.grid2>.card{padding:9px 12px!important}
  .slide>.grid2>.card p{font-size:11px!important;line-height:1.33!important}
  .kind{padding:9px 12px}
  .kind p{font-size:10.8px;line-height:1.32}
  .slide>.example{padding:9px 12px}
  .example .label{font-size:8.8px;margin-bottom:4px}
  .exlist li{font-size:10.8px;line-height:1.32}
  .slide>.grid3{margin-top:7px!important}
  .slide>.listen{margin-top:3px}
  .slide>#scoreit{margin-top:0}
  .slide>.grid2.grow.tall{margin-top:7px!important}
  .slide>.grid2.grow.tall + .grid2{margin-top:7px!important}
  .slide>.grid2.grow.tall + .grid2 > .card p{font-size:10.6px!important;line-height:1.3!important}
}
@media (max-width:1240px){
  .slide h2{font-size:25px}
  .slide>p.sub{font-size:11.6px!important;line-height:1.32}
  .maprow{padding:3px 0;font-size:10px;gap:9px;line-height:1.3}
  .maprow3{padding:3px 0;font-size:10px;gap:8px;line-height:1.3}
  .maprow.maphead,.maprow3.maphead{font-size:8px}
  .mapnote{font-size:9.6px;padding-top:4px;margin-top:4px}
  .lsitem p{font-size:10px;line-height:1.26}
  .lsitem .lh{font-size:10px}
  .slide>.listen{margin-top:6px}
  .slide>.actbar{padding:7px 12px}
  .slide>.actbar p{font-size:10.4px;line-height:1.3}
  .slide>.actbar .lab{font-size:9px}
  .slide>.grid3>.card{padding:8px 10px!important}
  .slide>.grid3>.card p{font-size:10.4px!important;line-height:1.3!important}
  .slide>.grid2>.card{padding:9px 11px!important}
  .slide>.grid2>.card p{font-size:10.6px!important;line-height:1.3!important}
  .kind{padding:8px 11px}
  .kind p{font-size:10.2px;line-height:1.3}
  .slide>.example{padding:8px 11px}
  .example .label{font-size:8.6px;margin-bottom:4px}
  .exlist li{font-size:10.4px;line-height:1.3}
  .dpre{font-size:9px;line-height:1.34}

<script>
/* ============================================================= SLIDE DATA */
const SLIDES = [
/* 0 COVER */
`<div class="cover">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="driftchip" style="top:11%;right:28%">"that is an IT problem"</div>
  <div class="driftchip" style="top:79%;right:36%;animation-delay:-2s">"let me walk you through the deck"</div>
  <div class="driftchip" style="top:87%;right:13%;animation-delay:-4s">"we'll just lift and shift"</div>
  <div class="left">
    <div class="eyebrow riseUp"><span class="dot"></span> CONSULTATIVE &amp; ENTERPRISE THINKING</div>
    <h1 class="riseUp d1"><span class="shimmer">Eight tools.</span><br>Two companies<br>that used them.</h1>
    <p class="sub riseUp d2" style="margin-top:12px;max-width:600px">Four frameworks for seeing an organisation as one system, and four methods for taking a problem apart and saying it out loud. We learn each one from a company that actually did it, then you use all eight on something nobody has decided yet.</p>
    <div class="riseUp d3" style="margin-top:18px;display:flex;gap:8px;flex-wrap:wrap">
      <span class="pill">Two real scenarios</span>
      <span class="pill">10-minute break</span>
      <span class="pill" style="border-color:var(--sage);color:var(--sage)">30-minute pre-mortem</span>
    </div>
  </div>
  <div class="riseUp d2" style="flex:1;max-width:430px;display:flex;flex-direction:column;gap:11px;z-index:2">
    <div class="card" style="padding:12px 14px;border-left:3px solid var(--cobalt)"><div class="chip" style="font-size:9.5px">Scenario one teaches you to see</div><p style="font-size:12.5px;margin-top:6px;line-height:1.4"><b>Systems Thinking. Value Chain. Capability Modeling. Enterprise Architecture.</b> Learned from a company that lost three days of business to one database.</p></div>
    <div class="card" style="padding:12px 14px;border-left:3px solid var(--amber)"><div class="chip amber" style="font-size:9.5px">Scenario two teaches you to say</div><p style="font-size:12.5px;margin-top:6px;line-height:1.4"><b>MECE. Hypothesis-driven. The 80/20 rule. The Pyramid Principle.</b> Learned from a company that banned slides and made people read in silence instead.</p></div>
    <div class="card" style="padding:12px 14px;border-left:3px solid var(--sage)"><div class="chip" style="font-size:9.5px">You leave with</div><p style="font-size:12.5px;margin-top:6px;line-height:1.4">A one-page failure memo on a product that is live right now, written the way the second company writes them, about a system seen the way the first company learned to see.</p></div>
    <div style="background:var(--ink);color:#EAF0FF;border-radius:13px;padding:12px 14px">
      <div style="font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);font-weight:700">Why both halves, in one line</div>
      <div style="font-family:var(--disp);font-size:17px;font-weight:800;margin-top:5px;line-height:1.2">Seeing it is half.<br>Being believed is the other half.</div>
      <p style="font-size:12px;margin-top:7px;line-height:1.4;color:rgba(234,240,255,.88)">Architects who only have the first four frameworks are right in private. Architects who only have the last four methods are persuasive about the wrong thing.</p>
    </div>
  </div>
</div>`,

/* 1 SCENARIO ONE: NETFLIX, ENTERPRISE THINKING */
`<div class="eyebrow reveal"><span class="dot"></span> SCENARIO ONE · CORE FRAMEWORKS OF ENTERPRISE THINKING</div>
<h2 class="reveal">Netflix, August 2008: three days unable to ship a single DVD, and a seven-year answer</h2>
<p class="sub reveal">A major database corruption stopped Netflix shipping DVDs to members for three days. The obvious fix was a better database. What they did instead finished in January 2016, and it is the clearest worked example of enterprise thinking available in public.</p>
<div class="example reveal" style="margin-top:8px">
  <div class="label">What actually happened, from Netflix's own account</div>
  <ul class="exlist">
    <li><b>August 2008:</b> database corruption, three days with no DVDs shipped. Netflix concluded the problem was <b>vertically scaled single points of failure</b>, not that one database. <b>Lift and shift was rejected</b>, on the grounds that forklifting systems unchanged carries the data centre's problems and limits along with them.</li>
    <li>Instead: a monolith split into <b>hundreds of microservices</b>, the data model denormalised onto NoSQL, and budget approvals, centralised release coordination and multi-week hardware provisioning replaced by continuous delivery and self-service.</li>
    <li>Finished <b>early January 2016</b>, about seven years. Over the same period streaming members grew <b>eight times</b> and viewing grew by <b>three orders of magnitude</b>. On 6 January 2016 Netflix launched in over 130 new countries.</li>
  </ul>
</div>
<div class="tablefill reveal" style="margin-top:9px">
  <div class="maprow3 maphead" style="grid-template-columns:0.6fr 1.12fr 1.5fr 1.12fr"><div>Framework</div><div>What it means</div><div>What Netflix actually did</div><div>The question it makes you ask</div></div>
  <div class="maprow3" style="grid-template-columns:0.6fr 1.12fr 1.5fr 1.12fr"><div><b>SYSTEMS THINKING</b></div><div style="font-family:var(--body);font-size:11.9px">The organisation is one connected ecosystem. A change or a failure in one place lands somewhere else, usually somewhere nobody owns.</div><div>A shipping database took out the ability to serve members. Netflix stopped asking which box broke and started asking what the <b>blast radius</b> of any box was allowed to be.</div><div>"What is this component allowed to take down with it?"</div></div>
  <div class="maprow3" style="grid-template-columns:0.6fr 1.12fr 1.5fr 1.12fr"><div><b>VALUE CHAIN OPTIMIZATION</b></div><div style="font-family:var(--body);font-size:11.9px">Walk every step from raw input to the thing the customer receives, and take out the steps that add cost without adding value.</div><div>Budget approval, a centralised release meeting and multi-week provisioning were <b>steps in the chain</b> between an idea and a member. Lift and shift would have kept all three and changed only the address.</div><div>"Which steps between the idea and the customer exist only because of how we are organised?"</div></div>
  <div class="maprow3" style="grid-template-columns:0.6fr 1.12fr 1.5fr 1.12fr"><div><b>CAPABILITY MODELING</b></div><div style="font-family:var(--body);font-size:11.9px">Map what the organisation must be able to <b>do</b> to execute the strategy, not how it is currently structured. Capabilities outlive org charts.</div><div>Survive the loss of any component, scale a thousandfold, release without a coordination meeting, open a country without a build. The 2008 org chart predicted none of that. The capabilities did.</div><div>"What must we be able to do in three years that we cannot do today?"</div></div>
  <div class="maprow3" style="grid-template-columns:0.6fr 1.12fr 1.5fr 1.12fr"><div><b>ENTERPRISE ARCHITECTURE</b></div><div style="font-family:var(--body);font-size:11.9px">Line the business strategy up with infrastructure, data, governance and the way people actually work, so the organisation can move.</div><div>Strategy global streaming, infrastructure public cloud, data denormalised NoSQL, governance failure drills in production, operating model self-service. The 130-country launch and the last data centre shutting fall in <b>the same month</b>.</div><div>"If the strategy changed tomorrow, which of these four would stop us?"</div></div>
  <div class="mapnote">Every one of those four is a way of refusing the question as it was asked. <b>"Fix the database"</b> was the question. <b>"What is this database allowed to take down with it"</b> was the answer, and it took seven years because it was the right question.</div>
</div>`,

/* 2 SCENARIO TWO: AMAZON, CONSULTING METHODOLOGIES */
`<div class="eyebrow reveal"><span class="dot"></span> SCENARIO TWO · KEY CONSULTING METHODOLOGIES</div>
<h2 class="reveal">Amazon, 9 June 2004: the email that banned slides and replaced them with reading</h2>
<p class="sub reveal">At 6:02pm Jeff Bezos emailed Amazon's senior team under the subject line "No powerpoint presentations from now on at steam". What replaced the deck was a narrative memo of roughly four to six pages, read in silence at the start of the meeting. That format is four consulting methods wearing one coat.</p>
<div class="example reveal" style="margin-top:8px">
  <div class="label">What the format actually is</div>
  <ul class="exlist">
    <li>The stated goal, from the email itself: <b>"Well structured, narrative text is what we're after rather than just text."</b> Bullets were ruled out alongside slides, because a bullet lets you assert a thing without owning the sentence that connects it to the next one.</li>
    <li>Meetings open with roughly <b>20 minutes of silent reading</b>. Nobody presents. The author takes questions afterwards, which means the author cannot talk over a weak argument.</li>
    <li>For anything new, the companion practice is <b>working backwards</b>: write the press release and the FAQ as if the thing already shipped, <b>before</b> it is built. The constraint is the method. Four to six pages, twenty minutes, and no speaker to fill the gaps.</li>
  </ul>
</div>
<div class="tablefill reveal" style="margin-top:9px">
  <div class="maprow3 maphead" style="grid-template-columns:0.6fr 1.12fr 1.5fr 1.12fr"><div>Method</div><div>What it means</div><div>What the Amazon format actually does</div><div>The question it makes you ask</div></div>
  <div class="maprow3" style="grid-template-columns:0.6fr 1.12fr 1.5fr 1.12fr"><div><b>PYRAMID PRINCIPLE</b></div><div style="font-family:var(--body);font-size:11.9px">Lead with the recommendation, then the arguments that support it, then the data under those. Never build to a reveal.</div><div>The press release <b>is</b> the conclusion, written first, in the customer's words. A deck asks for your attention for thirty slides before it tells you anything.</div><div>"If they read only my first sentence, have they got my answer?"</div></div>
  <div class="maprow3" style="grid-template-columns:0.6fr 1.12fr 1.5fr 1.12fr"><div><b>MECE</b></div><div style="font-family:var(--body);font-size:11.9px">Mutually exclusive, collectively exhaustive. Cut the problem so nothing is counted twice and nothing is left out.</div><div>The FAQ splits into customer questions and internal questions, and every objection lands in exactly one. Fits both, your cut is wrong. Fits neither, you have a gap.</div><div>"What am I cutting on, and could a reasonable person cut it differently?"</div></div>
  <div class="maprow3" style="grid-template-columns:0.6fr 1.12fr 1.5fr 1.12fr"><div><b>HYPOTHESIS-DRIVEN PROBLEM SOLVING</b></div><div style="font-family:var(--body);font-size:11.9px">Commit to an educated guess early and in writing, then go and find the targeted evidence that would prove or kill it.</div><div>The press release is a written claim about customer value made <b>before anything is built</b>, precisely so it can be attacked. The FAQ is where the author is expected to kill their own idea first.</div><div>"What would have to be true for me to be wrong, and how would I find out?"</div></div>
  <div class="maprow3" style="grid-template-columns:0.6fr 1.12fr 1.5fr 1.12fr"><div><b>THE 80/20 RULE</b></div><div style="font-family:var(--body);font-size:11.9px">Find the small set of causes or drivers that produce most of the effect, and spend your attention there rather than spreading it evenly.</div><div>Four to six pages does not shorten your thinking, it forces you to carry only the arguments that <b>decide</b> the thing. Twenty minutes applies the same cap to the room's attention.</div><div>"Which two of my arguments would change the decision on their own?"</div></div>
  <div class="mapnote">None of these four are writing tips. They are a way of being <b>falsifiable in public</b>. A deck lets you hide behind delivery and a narrative does not, which is exactly why it is uncomfortable and exactly why it works.</div>
</div>`,

/* 3 BREAK */
`<div class="grow center" style="position:relative">
  <div class="blob b2" style="right:15%;top:12%;opacity:.3"></div>
  <div class="eyebrow reveal" style="justify-content:center"><span class="dot"></span> TEN MINUTES</div>
  <h1 class="reveal" style="text-align:center">Break.</h1>
  <p class="sub reveal" style="text-align:center;max-width:560px;font-size:16px">When you sit back down, all eight of those tools get pointed at a product that is live today, and you will be told it has already failed.</p>
  <div class="reveal" style="margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:11px">
    <div id="breakclock" style="font-family:var(--disp);font-size:62px;color:var(--cobalt);font-weight:700">10:00</div>
    <div style="display:flex;gap:7px;justify-content:center">
      <button class="jbtn" style="background:var(--card);color:var(--ink);border:2px solid var(--line);padding:7px 13px" onclick="breakAdjust(-5)">-5</button>
      <button class="jbtn" style="background:var(--card);color:var(--ink);border:2px solid var(--line);padding:7px 13px" onclick="breakAdjust(-1)">-1</button>
      <button class="jbtn" style="background:var(--card);color:var(--ink);border:2px solid var(--line);padding:7px 13px" onclick="breakAdjust(1)">+1</button>
      <button class="jbtn" style="background:var(--card);color:var(--ink);border:2px solid var(--line);padding:7px 13px" onclick="breakAdjust(5)">+5</button>
    </div>
    <div style="display:flex;gap:9px">
      <button class="jbtn rev" id="breakbtn" onclick="breakToggle()">START</button>
      <button class="jbtn" style="background:var(--card);color:var(--ink);border:2px solid var(--line)" onclick="breakStop()">STOP</button>
      <button class="jbtn" style="background:var(--card);color:var(--ink);border:2px solid var(--line)" onclick="breakReset()">RESET</button>
    </div>
  </div>
</div>`,
/* 4 PRE-MORTEM: THE SCENARIO */
`<div class="eyebrow reveal"><span class="dot"></span> PRE-MORTEM &middot; THE SCENARIO</div>
<div class="reveal" style="margin:1px 0 4px"><span class="chip amber" style="font-size:10px;letter-spacing:.15em;font-weight:800">HYPOTHETICAL &middot; THIS HAS NOT HAPPENED</span></div>
<h2 class="reveal">It is eighteen months from now. Amazon has quietly retired Alexa+. Work out why.</h2>
<p class="sub reveal">We are assuming the failure, not reporting it. A pre-mortem is a post-mortem run before the fact: you are given the outcome and you reason backwards to the cause. Every line below is public, dated and still live today. Read the middle column as promises already made out loud, and the right as the place the evidence runs out.</p>
<div class="tablefill reveal" style="margin-top:9px">
  <div class="maprow3 maphead" style="grid-template-columns:0.6fr 1.44fr 1.5fr"><div>&nbsp;</div><div>What Amazon has committed to, in public</div><div>Where the evidence runs out</div></div>
  <div class="maprow3" style="grid-template-columns:0.6fr 1.44fr 1.5fr"><div><b>REACH</b></div><div style="font-family:var(--body);font-size:12px;color:var(--ink)">Announced <b>26 Feb 2025</b>, open to <b>all US customers on 4 Feb 2026</b> after a year in beta. Over <b>600 million</b> Alexa devices sold, and Amazon says <b>97%</b> of them can run it.</div><div>Hardly anyone was using it at first: <b>100,000 people in May 2025</b>, against 600 million devices. "Tens of millions" by the February 2026 launch. The devices are hardware people already own and never chose to upgrade.</div></div>
  <div class="maprow3" style="grid-template-columns:0.6fr 1.44fr 1.5fr"><div><b>THE PAID PROMISE</b></div><div style="font-family:var(--body);font-size:12px;color:var(--ink)">It does not answer, it <b>acts</b>. It books through other companies: Ticketmaster, Uber, OpenTable, Expedia, Yelp and more.</div><div><b>Nobody knows how many people use the booking features, and those are the features you pay for.</b> Amazon has never published a number for completed tasks.</div></div>
  <div class="maprow3" style="grid-template-columns:0.6fr 1.44fr 1.5fr"><div><b>PRICE</b></div><div style="font-family:var(--body);font-size:12px;color:var(--ink)"><b>Free with Prime.</b> <b>$19.99 a month</b> if you are not a Prime member. A free tier exists on the web and in the app, with limits Amazon has declined to specify.</div><div>The paid product is <b>given away inside Prime</b>, so the clearest signal of whether anyone values it is switched off on purpose. There are no cancellations to count.</div></div>
  <div class="maprow3" style="grid-template-columns:0.6fr 1.44fr 1.5fr"><div><b>ACCURACY</b></div><div style="font-family:var(--body);font-size:12px;color:var(--ink)">It is the default assistant on that hardware, and you can still switch back to the old Alexa. Amazon has not said for how long.</div><div><b>Amazon's own chief executive called this kind of AI "primitive".</b> The accuracy target was moving from about <b>30% to 60%</b>. Above 90% is described as a long-term goal.</div></div>
  <div class="maprow3" style="grid-template-columns:0.6fr 1.44fr 1.5fr"><div><b>THE NUMBERS THEY DID PUBLISH</b></div><div style="font-family:var(--body);font-size:12px;color:var(--ink)">More music played. More recipes used. More conversations, and longer ones. All of it real, all of it reported.</div><div><b>Every one of those is about talking, not finishing.</b> Nothing published says whether a booking actually completed, which is the only thing the $19.99 is for.</div></div>
  <div class="mapnote"><b>The shape of the bet, in one line:</b> a paid product given away inside a bundle, promising to complete whole tasks inside other companies' systems, at an accuracy its own chief executive calls early, on hardware nobody chose to upgrade. <b>The gap between those two columns is where your five failure modes live.</b></div>
</div>
<div class="listen reveal">
  <div class="lsitem"><div class="lh">You are not predicting, you are reasoning</div><p>Nobody in this room knows what happens to Alexa+, and that is the point. A pre-mortem is judged on <b>whether the failure path is credible</b> and whether the signal could genuinely have been seen in time, never on whether it comes true.</p></div>
